<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAW Site Backup</title><style>body{font:15px Arial;background:#f3f7fb;color:#123b59;margin:0}header{background:#124773;color:white;padding:20px;border-bottom:4px solid #f58021}main{max-width:850px;margin:20px auto;padding:12px}.card{background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #1233}button,select{padding:12px;border-radius:8px;margin:5px;border:1px solid #bbb}button{background:#14639a;color:white;font-weight:bold}button:disabled{background:#aeb8c0}.warning{background:#fff2e5;padding:12px;border-left:4px solid orange}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}</style></head><body><header><strong>ARIF AGRO WORKS</strong><div>Site Backup · Master Admin Only</div></header><main><div class="card"><h2>Site Backup Preparation</h2><p id="auth">Checking login…</p><section id="tools" hidden><select id="site"></select><button id="read">Load Site Records</button><p><button id="excel" disabled>Download Excel</button><button id="pdf" disabled>Print PDF Inventory</button></p></section><p id="status"></p><div id="results"></div></div><div class="card"><h2>Hard Delete</h2><p class="warning">LOCKED. A full restorable backup and verified database dependency map are required before permanent deletion can be enabled.</p><button disabled>Confirm 1 — 8 seconds</button><button disabled>Confirm 2 — 8 seconds</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=x=>document.getElementById(x),safe=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const db=window.supabase?.createClient('https://qfydekphbdpvvczhimjs.supabase.co','sb_publishable_s7zc99g86_YZJeN0vbCzwA_gCrkdavn');
const tables=['workers','worker_attendance','worker_advances','worker_salary_payments','site_expenses','site_cash_ledger','food_settlements'];let snap=null;
async function init(){try{if(!db)throw Error('Library unavailable');let u=await db.auth.getUser();if(!u.data?.user)throw Error('Login to Portal first');let p=await db.from('staff_profiles').select('role').eq('user_id',u.data.user.id).single();if(p.error||p.data?.role!=='master')throw Error('Master Admin only');let s=await db.from('sites').select('id,site_name').eq('is_active',true);if(s.error)throw s.error;$('site').innerHTML=s.data.map(x=>`<option value="${safe(x.id)}">${safe(x.site_name)}</option>`).join('');$('auth').textContent='Master Admin verified · Read only';$('tools').hidden=false}catch(e){$('auth').textContent='Access blocked: '+e.message}}
async function fetchAll(t,id){let out=[];for(let offset=0;offset<=100000;offset+=500){let r=await db.from(t).select('*').eq('site_id',id).range(offset,offset+499);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<500)return out}throw Error('Size limit exceeded')}
$('read').onclick=async()=>{snap=null;$('excel').disabled=$('pdf').disabled=true;let id=$('site').value,name=$('site').selectedOptions[0].textContent,data={},inventory=[];$('status').textContent='Reading records…';for(let t of tables){try{data[t]=await fetchAll(t,id);inventory.push({table:t,rows:data[t].length,status:'Read'})}catch(e){inventory.push({table:t,rows:'—',status:e.message})}}snap={name,id,data,inventory,created:new Date().toISOString()};$('results').innerHTML='<h3>Partial export inventory</h3><table><tr><th>Table</th><th>Rows</th><th>Status</th></tr>'+inventory.map(x=>`<tr><td>${safe(x.table)}</td><td>${safe(x.rows)}</td><td>${safe(x.status)}</td></tr>`).join('')+'</table>';$('status').textContent='Partial export only: other related tables and server-only records may be missing. Deletion remains locked.';$('excel').disabled=$('pdf').disabled=false};
$('excel').onclick=async()=>{if(!snap)return;try{if(!window.XLSX)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet([{site:snap.name,generated:snap.created,complete_backup:'NO'}]),'Manifest');XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(snap.inventory),'Inventory');for(let [t,rows] of Object.entries(snap.data))XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows.length?rows:[{info:'No rows'}]),t.slice(0,31));XLSX.writeFile(w,'AAW_'+snap.name.replace(/[^a-z0-9]/gi,'_')+'_PARTIAL.xlsx')}catch(e){$('status').textContent='Excel error: '+e.message}};
$('pdf').onclick=()=>{if(!snap)return;let w=window.open('','_blank');if(!w){$('status').textContent='Allow popups to print';return}w.document.write('<h1>Arif Agro Works</h1><h2>Site '+safe(snap.name)+' — Partial Export Inventory</h2><p>NOT a complete backup. No deletion permitted.</p><table border="1" cellpadding="8"><tr><th>Table</th><th>Rows</th><th>Status</th></tr>'+snap.inventory.map(x=>'<tr><td>'+safe(x.table)+'</td><td>'+safe(x.rows)+'</td><td>'+safe(x.status)+'</td></tr>').join('')+'</table>');w.document.close();w.print()};init();
</script></body></html>
