
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arif Agro Works | Management</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf5f8;background:#071b28}
*{box-sizing:border-box}
body{margin:0}
header{background:#0c2c3d;border-bottom:3px solid #ff752e;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:0}
b,.accent{color:#ff752e}
small,.muted{color:#a8c0ca}
main{max-width:900px;margin:18px auto;padding:0 12px}
.panel{background:#103044;border:1px solid #325365;border-radius:15px;padding:18px;margin-bottom:15px}
h2{margin:0 0 12px;font-size:20px}
h3{font-size:16px}
label{display:block;font-size:13px;color:#c8dce5;margin:9px 0}
input,select,textarea{display:block;width:100%;background:#071e2d;color:#fff;border:1px solid #547083;border-radius:8px;padding:11px;margin-top:5px;font-size:16px}
textarea{min-height:60px}
button{background:#ff752e;color:#102330;border:0;border-radius:9px;padding:11px 13px;font-weight:700;cursor:pointer}
button.secondary{background:#22465a;color:white;border:1px solid #607f91}
button:disabled{opacity:.6}
.hide{display:none!important}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font-size:13px;padding:9px 10px}
.tabs .active{background:#ff752e;color:#102330}
.tabs button:not(.active){background:#22465a;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.item{border:1px solid #39586b;border-radius:10px;padding:12px;margin:8px 0;background:#092333;overflow-wrap:anywhere}
.item small{display:block;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#status{color:#ffbf92;white-space:pre-wrap;min-height:22px}
footer{text-align:center;color:#91aeba;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
<div>
<h1>ARIF <b>AGRO</b> WORKS</h1>
<small>PRIVATE MANAGEMENT PORTAL · V5.1</small>
</div>
<button class="secondary hide" id="logout">Logout</button>
</header>

<main>
<section class="panel" id="login">
<h2>Master / Incharge Login</h2>
<label>Email<input id="email" type="email" autocomplete="username"></label>
<label>Password<input id="password" type="password" autocomplete="current-password"></label>
<button id="signin">Secure Login</button>
</section>

<section id="app" class="hide">
<section class="panel">
<div id="who" class="muted"></div>
<label>Site चुनें<select id="site"></select></label>
<div id="tabs" class="tabs"></div>
</section>
<section class="panel" id="content"></section>
</section>
<p id="status" role="status"></p>
</main>

<footer>Authorized access only · Test site permissions before using real financial records</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';

const URL='https://qfydekphbdpvvczhimjs.supabase.co';
const KEY='sb_publishable_s7zc99g86_YZJeN0vbCzwA_gCrkdavn';

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const hide=(id,yes)=>$(id).classList.toggle('hide',yes);
const msg=v=>$('status').textContent=v;

let db,role=null,sites=[],workers=[],tab='workers';
let editing=null,showDeleted=false,renderVersion=0;

const modules=[
['workers','Workers'],
['summary','Salary Summary'],
['attendance','Attendance'],
['advances','Advances'],
['expenses','Expenses'],
['salary','Salary Payments'],
['cash','Cash Ledger']
];

const spec={
workers:{
table:'workers',
fields:[
['full_name','Worker name','text',true],
['mobile_number','Mobile','tel'],
['joining_date','Joining date','date'],
['leaving_date','Leaving date','date'],
['daily_wage','Daily wage','number'],
['overtime_rate','OT rate','number']
]},
attendance:{
table:'worker_attendance',
fields:[
['worker_id','Worker','worker',true],
['attendance_date','Date','date',true],
['status','Status','status',true],
['check_in','In time','time'],
['check_out','Out time','time'],
['overtime_hours','OT hours','number']
]},
advances:{
table:'worker_advances',
fields:[
['worker_id','Worker','worker',true],
['advance_date','Date','date',true],
['amount','Amount','number',true],
['notes','Notes','text']
]},
expenses:{
table:'site_expenses',
fields:[
['expense_date','Date','date',true],
['category','Category','text',true],
['description','Description','text'],
['amount','Amount','number',true]
]},
salary:{
table:'worker_salary_payments',
fields:[
['worker_id','Worker','worker',true],
['payment_date','Date','date',true],
['period_start','Period from','date'],
['period_end','Period to','date'],
['amount','Amount','number',true],
['notes','Notes','text']
]},
cash:{
table:'site_cash_ledger',
fields:[
['entry_date','Date','date',true],
['entry_type','Type','cash',true],
['category','Category','text',true],
['description','Description','text'],
['amount','Amount','number',true]
]}
};

try{
db=window.supabase.createClient(URL,KEY,{
auth:{persistSession:true,autoRefreshToken:true}
});
}catch(e){
msg('Supabase library नहीं खुली');
return;
}

$('signin').onclick=async()=>{
msg('Login हो रहा है...');
const {error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error)msg(error.message);
else await init();
};

$('logout').onclick=async()=>{
await db.auth.signOut();
role=null;
hide('login',false);
hide('app',true);
hide('logout',true);
msg('Logged out');
};

$('site').onchange=()=>{
editing=null;
showDeleted=false;
render();
};

async function init(){
const {data:{user},error:ue}=await db.auth.getUser();

if(ue||!user){
hide('login',false);
hide('app',true);
hide('logout',true);
return;
}

const {data:p,error:pe}=await db
.from('staff_profiles')
.select('role,full_name')
.eq('user_id',user.id)
.single();

if(pe||!p){
msg('Profile error: '+(pe?.message||'Not found'));
return;
}

role=p.role;

const {data:s,error:se}=await db
.from('sites')
.select('id,site_name')
.eq('is_active',true)
.order('site_name');

if(se){
msg('Sites error: '+se.message);
return;
}

sites=s||[];

hide('login',true);
hide('app',false);
hide('logout',false);

$('who').textContent=(p.full_name||'Staff')+' · '+role;

const previous=$('site').value;

$('site').innerHTML=sites.map(x=>
`<option value="${esc(x.id)}">${esc(x.site_name)}</option>`
).join('');

if(sites.some(x=>x.id===previous)){
$('site').value=previous;
}

await render();
}

function fieldHTML([k,label,type,required]){
let input;

if(type==='worker'){
input=`<select name="${k}" ${required?'required':''}>
<option value="">Choose worker</option>
${workers.filter(w=>w.is_deleted!==true&&w.is_active!==false)
.map(w=>`<option value="${esc(w.id)}">${esc(w.full_name)}</option>`)
.join('')}
</select>`;
}else if(type==='status'){
input=`<select name="${k}">
<option value="present">Present</option>
<option value="absent">Absent</option>
<option value="half_day">Half day</option>
<option value="leave">Leave</option>
</select>`;
}else if(type==='cash'){
input=`<select name="${k}">
<option value="cash_in">Cash in</option>
<option value="cash_out">Cash out</option>
</select>`;
}else{
input=`<input name="${k}" type="${type}"
${required?'required':''}
${type==='number'?'step="0.01" min="0"':''}
${type==='date'?'value="'+new Date().toLocaleDateString('en-CA')+'"':''}>`;
}

return `<label>${esc(label)}${required?' *':''}${input}</label>`;
}

async function renderSummary(site){
const now=new Date();
const localToday=new Date(now.getTime()-now.getTimezoneOffset()*60000)
.toISOString().slice(0,10);
const month=localToday.slice(0,7);

$('content').innerHTML=`
<h2>Salary Summary</h2>
<p class="muted">Single Worker या All Workers की Salary Calculate करें</p>
<label>Worker चुनें
<select id="salaryWorker">
<option value="all">All Workers — सबकी Salary</option>
</select>
</label>
<div class="grid">
<label>From
<input type="date" id="fromDate" value="${month}-01">
</label>
<label>To
<input type="date" id="toDate" value="${localToday}">
</label>
</div>
<button id="calculate">Calculate Salary</button>
<p class="muted">
Current worker wage और OT rate पर हिसाब;
पुरानी rates बदलने पर historical calculation अलग हो सकती है।
</p>
<div id="salaryResults"></div>`;

const {data:allWorkers,error:workerError}=await db
.from('workers')
.select('id,full_name,daily_wage,overtime_rate,is_deleted')
.eq('site_id',site)
.order('full_name');

if(workerError){
msg('Workers loading failed: '+workerError.message);
return;
}

const workerList=allWorkers||[];

$('salaryWorker').innerHTML=
'<option value="all">All Workers — सबकी Salary</option>'+
workerList.map(w=>
`<option value="${esc(w.id)}">${esc(w.full_name)}${w.is_deleted?' (Archived)':''}</option>`
).join('');

$('calculate').onclick=async()=>{
const start=$('fromDate').value;
const end=$('toDate').value;
const selectedWorker=$('salaryWorker').value;

if(!start||!end||start>end){
msg('Valid dates चुनें');
return;
}

const selectedWorkers=selectedWorker==='all'
?workerList
:workerList.filter(w=>w.id===selectedWorker);

if(!selectedWorkers.length){
msg('Worker नहीं मिला');
return;
}

const btn=$('calculate');
btn.disabled=true;
msg('Salary calculate हो रही है...');

let attendanceQuery=db.from('worker_attendance')
.select('worker_id,status,overtime_hours')
.eq('site_id',site)
.gte('attendance_date',start)
.lte('attendance_date',end);

let advancesQuery=db.from('worker_advances')
.select('worker_id,amount')
.eq('site_id',site)
.gte('advance_date',start)
.lte('advance_date',end);

let paymentsQuery=db.from('worker_salary_payments')
.select('worker_id,amount')
.eq('site_id',site)
.gte('payment_date',start)
.lte('payment_date',end);

if(selectedWorker!=='all'){
attendanceQuery=attendanceQuery.eq('worker_id',selectedWorker);
advancesQuery=advancesQuery.eq('worker_id',selectedWorker);
paymentsQuery=paymentsQuery.eq('worker_id',selectedWorker);
}

const [at,ad,pa]=await Promise.all([
attendanceQuery.range(0,9999),
advancesQuery.range(0,9999),
paymentsQuery.range(0,9999)
]);

btn.disabled=false;

const failure=[at,ad,pa].find(x=>x.error);

if(failure){
msg('Calculation failed: '+failure.error.message);
return;
}

if([at,ad,pa].some(x=>x.data.length>=10000)){
msg('बहुत ज्यादा records हैं; date range छोटा करो');
return;
}

const money=n=>'₹'+Number(n).toLocaleString('en-IN',{
minimumFractionDigits:2,
maximumFractionDigits:2
});

const total=(rows,id,key)=>rows
.filter(r=>r.worker_id===id)
.reduce((sum,r)=>sum+Number(r[key]||0),0);

let overall=0;

$('salaryResults').innerHTML=selectedWorkers.map(w=>{
const attendance=at.data.filter(r=>r.worker_id===w.id);

const days=attendance.reduce((n,r)=>
n+(r.status==='present'?1:r.status==='half_day'?0.5:0),0);

const ot=total(attendance,w.id,'overtime_hours');

const wage=days*Number(w.daily_wage||0);
const overtime=ot*Number(w.overtime_rate||0);
const advance=total(ad.data,w.id,'amount');
const paid=total(pa.data,w.id,'amount');

const due=wage+overtime-advance-paid;
overall+=due;

return `<div class="item">
<strong>${esc(w.full_name)}${w.is_deleted?' (Archived)':''}</strong>
<small>Paid days: ${days} · OT hours: ${ot}</small>
<small>
Wages ${money(wage)} + OT ${money(overtime)}
− Advance ${money(advance)} − Paid ${money(paid)}
</small>
<strong>Balance: ${money(due)}</strong>
</div>`;
}).join('')+
`<div class="item">
<strong>${selectedWorker==='all'?'Total balance':'Selected worker balance'}: ${money(overall)}</strong>
</div>`;

msg('Calculation ready · Selected date range only');
};
}

async function render(){
const version=++renderVersion;
const site=$('site').value;

if(!site){
$('content').textContent='No assigned active sites';
return;
}

const tabs=modules.filter(([k])=>
role==='master'||!['salary','cash','summary'].includes(k)
);

if(!tabs.some(([k])=>k===tab))tab='workers';

$('tabs').innerHTML=tabs.map(([k,n])=>
`<button data-tab="${k}" class="${tab===k?'active':''}">${n}</button>`
).join('');

$('tabs').querySelectorAll('[data-tab]').forEach(b=>{
b.onclick=()=>{
tab=b.dataset.tab;
editing=null;
showDeleted=false;
render();
};
});

const {data:w,error:we}=await db
.from('workers')
.select('id,full_name,is_active,is_deleted')
.eq('site_id',site)
.order('full_name');

if(version!==renderVersion)return;

if(we){
msg('Workers: '+we.message);
return;
}

workers=w||[];

if(tab==='summary'){
await renderSummary(site);
return;
}

const sp=spec[tab];

const order=tab==='workers'
?'created_at'
:(sp.fields.find(f=>f[2]==='date')||['created_at'])[0];

const {data,error}=await db
.from(sp.table)
.select('*')
.eq('site_id',site)
.order(order,{ascending:false})
.limit(100);

if(version!==renderVersion)return;

if(error){
msg('Entries: '+error.message);
return;
}

const visible=tab==='workers'
?(data||[]).filter(r=>showDeleted
?r.is_deleted===true
:r.is_deleted!==true)
:(data||[]);

const title=tabs.find(x=>x[0]===tab)?.[1]||tab;

$('content').innerHTML=`
<h2>${esc(title)}</h2>
<p class="muted">
${esc(sites.find(s=>s.id===site)?.site_name)} · Latest 100 records
</p>
${tab==='workers'&&role==='master'
?`<button type="button" class="secondary" id="deletedToggle">
${showDeleted?'Show Workers':'Deleted Workers / Restore'}
</button>`:''}
<div id="entries"></div>
<h3 id="formtitle">नई Entry</h3>
<form id="entry" class="grid"></form>`;

if($('deletedToggle')){
$('deletedToggle').onclick=()=>{
showDeleted=!showDeleted;
editing=null;
render();
};
}

const canWrite=role==='master'
||['workers','attendance','advances','expenses'].includes(tab);

const f=$('entry');

if(!canWrite||(tab==='workers'&&showDeleted)){
f.innerHTML='<p class="muted">'+
(showDeleted
?'Deleted Workers को Restore करने के लिए ऊपर Button दबाएँ।'
:'Only Master Admin can edit this section.')+
'</p>';
}else{
f.innerHTML=sp.fields.map(fieldHTML).join('')+
`<div class="actions">
<button type="submit" id="savebtn">Save Entry</button>
<button type="button" class="secondary hide" id="cancelEdit">
Cancel Edit
</button>
</div>`;

$('cancelEdit').onclick=()=>{
editing=null;
render();
};

f.onsubmit=async e=>{
e.preventDefault();

const btn=$('savebtn');
btn.disabled=true;

const values={site_id:site};

for(const [k,label,type] of sp.fields){
const v=f.elements[k].value;

if(v!==''){
values[k]=type==='number'?Number(v):v;
}else if(editing&&tab==='workers'){
values[k]=null;
}
}

const wasEditing=tab==='workers'&&!!editing;

const q=wasEditing
?db.from('workers')
.update(values)
.eq('id',editing)
.eq('site_id',site)
.select('id')
:db.from(sp.table)
.insert(values)
.select('id');

const {data:saved,error:err}=await q;

btn.disabled=false;

if(err){
msg('Save failed: '+err.message);
return;
}

if(!saved?.length){
msg('Save नहीं हुआ। Database permissions चेक करें।');
return;
}

editing=null;
await render();

msg(wasEditing?'Worker updated':'Entry saved');
};
}

$('entries').innerHTML=visible.length
?visible.map(r=>{
const name=r.full_name
||workers.find(w=>w.id===r.worker_id)?.full_name
||r.category||r.status||r.entry_type||'Entry';

const detail=Object.entries(r)
.filter(([k,v])=>
!['id','site_id','worker_id','created_at'].includes(k)&&v!==null)
.map(([k,v])=>k+': '+v)
.join(' · ');

let buttons='';

if(tab==='workers'&&role==='master'){
buttons=r.is_deleted===true
?`<div class="actions">
<button data-restore="${esc(r.id)}">Restore Worker</button>
</div>`
:`<div class="actions">
<button class="secondary" data-edit="${esc(r.id)}">Edit</button>
<button class="secondary" data-toggle="${esc(r.id)}">
${r.is_active===false?'Reactivate':'Deactivate'}
</button>
<button data-delete="${esc(r.id)}">Delete from List</button>
</div>`;
}

return `<div class="item">
<strong>${esc(name)}</strong>
${r.is_deleted===true?'<small>Deleted from list</small>':''}
<small>${esc(detail)}</small>
${buttons}
</div>`;
}).join('')
:'<p class="muted">No entries yet</p>';

if(tab!=='workers'||role!=='master')return;

const rows=visible;

$('entries').querySelectorAll('[data-edit]').forEach(b=>{
b.onclick=()=>{
const r=rows.find(x=>x.id===b.dataset.edit);

if(!r||!f.elements)return;

editing=r.id;

for(const [k] of sp.fields){
if(f.elements[k])f.elements[k].value=r[k]??'';
}

$('formtitle').textContent='Edit Worker: '+r.full_name;
$('savebtn').textContent='Update Worker';
$('cancelEdit').classList.remove('hide');

f.scrollIntoView({behavior:'smooth',block:'nearest'});
msg('Editing '+r.full_name);
};
});

$('entries').querySelectorAll('[data-toggle]').forEach(b=>{
b.onclick=async()=>{
const r=rows.find(x=>x.id===b.dataset.toggle);
if(!r)return;

const activate=r.is_active===false;

if(!confirm((activate?'Reactivate ':'Deactivate ')+r.full_name+'?')){
return;
}

b.disabled=true;

const {data:changed,error:err}=await db.from('workers')
.update({is_active:activate})
.eq('id',r.id)
.eq('site_id',site)
.select('id');

if(err||!changed?.length){
b.disabled=false;
msg(err?.message||'Update not permitted');
return;
}

editing=null;
await render();
msg(activate?'Worker reactivated':'Worker deactivated');
};
});

$('entries').querySelectorAll('[data-delete],[data-restore]')
.forEach(b=>{
b.onclick=async()=>{
const restoring=!!b.dataset.restore;
const id=b.dataset.restore||b.dataset.delete;
const r=rows.find(x=>x.id===id);

if(!r)return;

if(!confirm(
(restoring?'Restore ':'Remove from list (history will remain): ')+
r.full_name+'?'
))return;

b.disabled=true;

const values=restoring
?{is_deleted:false,deleted_at:null}
:{is_deleted:true,deleted_at:new Date().toISOString()};

const {data:changed,error:err}=await db.from('workers')
.update(values)
.eq('id',id)
.eq('site_id',site)
.eq('is_deleted',restoring)
.select('id');

if(err||!changed?.length){
b.disabled=false;
msg(err?.message||'Update not permitted');
return;
}

editing=null;
await render();

msg(restoring
?'Worker restored'
:'Worker removed from list; history preserved');
};
});
}

init();

db.auth.onAuthStateChange(event=>{
if(event==='SIGNED_OUT'){
hide('login',false);
hide('app',true);
hide('logout',true);
}
});

})();
</script>
</body>
</html>
