
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arif Agro Works | Management Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b28;color:#eef6fa;font-family:Arial,sans-serif}
header{background:#103044;border-bottom:3px solid #ff752e;padding:16px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:17px}
small,.muted{color:#abc3ce}
main{max-width:900px;margin:18px auto;padding:0 12px}
.box{background:#103044;border:1px solid #36596b;border-radius:13px;padding:15px;margin-bottom:14px}
label{display:block;font-size:13px;color:#c7dce5;margin:10px 0}
input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #567487;border-radius:7px;background:#071e2d;color:white;font-size:16px}
button{padding:10px 13px;background:#ff752e;border:0;border-radius:8px;color:#102330;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.alt{background:#284b60;color:white}
.hide{display:none!important}
.tabs,.actions{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.tabs button{background:#284b60;color:white;font-size:13px}
.tabs button.active{background:#ff752e;color:#102330}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{padding:12px;background:#092333;border:1px solid #36596b;border-radius:9px;margin:9px 0;overflow-wrap:anywhere}
.card small{display:block;margin:5px 0}
#notice,#loginMsg{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffccaa;margin:12px 0;font-size:13px}
.att{border-bottom:1px solid #36596b;padding:10px 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #36596b;padding:9px 5px;text-align:center}
th{background:#284b60}
th:first-child,td:first-child{text-align:left}
.slip{background:#fff;color:#111;padding:20px;border-radius:8px;margin-top:12px}
.slip h2,.slip h3{text-align:center}
.slip table th{background:#eee;color:#111}
.slip table td,.slip table th{border-color:#aaa}
.slip .muted{color:#555}
footer{text-align:center;color:#abc3ce;font-size:12px;padding:20px}


/* Arif Agro Works corporate UI refresh — presentation only */
:root{color-scheme:light;--navy:#103b61;--navy-dark:#0b2946;--orange:#f47a29;--paper:#ffffff;--canvas:#f3f7fb;--ink:#17324b;--muted:#62788a;--line:#dce6ef;--shadow:0 10px 30px rgba(14,49,81,.07)}
body{background:var(--canvas);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(112deg,var(--navy-dark),var(--navy));border-bottom:4px solid var(--orange);padding:18px clamp(16px,4vw,42px);box-shadow:0 5px 22px rgba(10,42,68,.13);gap:12px}
header b{font-size:clamp(18px,2.6vw,24px);letter-spacing:.7px;color:#fff}
header small{color:#c9e2f3;font-size:11px;letter-spacing:.6px}
header button.alt{background:#fff;color:var(--navy);border:1px solid #fff}
main{max-width:1120px;margin:24px auto;padding:0 clamp(12px,3vw,26px)}
h2,h3{color:var(--navy-dark);letter-spacing:-.25px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.5vw,26px);box-shadow:var(--shadow);margin-bottom:18px}
label{color:#425d73;font-size:13px;font-weight:600}
input,select,textarea{background:#fff;color:var(--ink);border:1px solid #cbd9e5;border-radius:10px;min-height:44px;outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:#2276ac;box-shadow:0 0 0 3px rgba(36,118,172,.11);outline:0}
button{background:var(--orange);color:#fff;border-radius:10px;min-height:42px;padding:10px 16px;box-shadow:0 3px 8px rgba(244,122,41,.14);transition:filter .15s,transform .15s}
button:hover:not(:disabled){filter:brightness(.95)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:3px solid #5ca4d2;outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.alt,.tabs button{background:#eaf2f8;color:var(--navy);box-shadow:none}
.tabs{gap:9px;margin-top:16px}
.tabs button{font-size:13px;border:1px solid #d5e5ef;font-weight:650}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px rgba(16,59,97,.15)}
.card{background:#f8fbfe;border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(18,58,91,.03)}
.card small,small,.muted{color:var(--muted)}
#notice,#loginMsg{color:#ad541f;background:#fff8f1;border-radius:8px;padding:7px 10px}
.att{border-bottom:1px solid var(--line)}
th,td{border:1px solid var(--line);padding:10px 8px}
th{background:#e9f2f9;color:var(--navy-dark)}
tr:nth-child(even) td{background:#fafcfe}
.slip{border:1px solid var(--line);box-shadow:var(--shadow)}
.slip table th{background:#eee;color:#111}
.slip table td,.slip table th{border-color:#aaa}
footer{color:var(--muted)}
#login{max-width:500px;margin:44px auto 30px}
#app>.box:first-child{border-top:4px solid var(--orange)}
@media(max-width:600px){header{padding:14px 16px}header b{font-size:17px}header small{font-size:9px;letter-spacing:0}main{margin:14px auto}.box{border-radius:13px;padding:14px}.tabs button{flex:1 1 auto;min-height:42px}.grid{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}table{font-size:12px}th,td{padding:8px 5px}}

</style>
</head>
<body>
<header>
<div><b>ARIF <span style="color:#ff752e">AGRO</span> WORKS</b><br>
<small>V5.34 RC · MANAGEMENT · FOOD · PAYROLL · PRODUCTION</small></div>
<button id="logout" class="alt hide">Logout</button>

<main>
<section id="login" class="box">
<h2>Master / Incharge Login</h2>
<form id="loginForm">
<label>Email<input id="email" type="email" required></label>
<label>Password<input id="password" type="password" required></label>

</form>

</section>

<div class="box">
<div id="who"></div>

</div>

</main>
<footer>Authorized access only · Arif Agro Works</footer>
<script>
const $=id=>document.getElementById(id);
const notice=t=>$('notice').textContent=String(t);
const info=t=>$('loginMsg').textContent=String(t);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const cash=x=>'₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const wait=(p,n=15000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('Request timeout')),n))]);
let db,role='',sites=[],workers=[],tab='workers',edit=null,deleted=false,seq=0;
const tabs=[
['workers','Workers'],
['summary','Salary Summary'],
['attendance','Attendance'],
['report','Monthly Report'],
['slip','Salary Slip'],
['food','Food Deduction'],
['advances','Advances'],
['expenses','Expenses'],
['salary','Salary Payments'],
['foodmanage','Food Management'],
['production','Daily Production'],
['billing','Company Documents'],
['ledger','Cash Ledger'],
['mastertools','Master Tools']
];
const config={
workers:['workers',[['full_name','Name','text',1],['mobile_number','Mobile','tel'],['joining_date','Joining','date'],['leaving_date','Leaving','date'],['daily_wage','Daily Wage','number'],['overtime_rate','OT Rate','number']]],
advances:['worker_advances',[['worker_id','Worker','worker',1],['advance_date','Date','date',1],['amount','Amount','number',1],['notes','Notes','text']]],
expenses:['site_expenses',[['expense_date','Date','date',1],['category','Category','text',1],['description','Description','text'],['amount','Amount','number',1]]],
ledger:['site_cash_ledger',[['entry_date','Date','date',1],['entry_type','Type','cash',1],['category','Category','text',1],['description','Description','text'],['amount','Amount','number',1]]]
};
window.onerror=(m,s,l)=>info('JavaScript Error line '+l+': '+m);
window.onunhandledrejection=e=>notice('Error: '+(e.reason?.message||e.reason));
function loadLibrary(){
const urls=[
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'
];
let i=0;
function next(){
if(window.supabase?.createClient){start();return}
if(i>=urls.length){info('Library loading failed');return}
info('Loading Supabase '+(i+1)+'...');
let s=document.createElement('script'),done=false;
let timer=setTimeout(()=>{if(!done){done=true;s.remove();next()}},10000);
s.onload=()=>{if(!done){done=true;clearTimeout(timer);next()}};
s.onerror=()=>{if(!done){done=true;clearTimeout(timer);next()}};
s.src=urls[i++];document.head.appendChild(s);
}
next();
}
async function start(){
try{
db=window.supabase.createClient(
'https://qfydekphbdpvvczhimjs.supabase.co',
'sb_publishable_s7zc99g86_YZJeN0vbCzwA_gCrkdavn'
);
$('loginBtn').disabled=false;
$('loginBtn').textContent='Secure Login';
info('Login service ready');
let r=await wait(db.auth.getSession());
if(r.data?.session)await init();
}catch(e){info('Startup Error: '+e.message)}
}
$('loginForm').onsubmit=async e=>{
e.preventDefault();
let b=$('loginBtn');
b.disabled=true;b.textContent='Logging in...';
info('Checking credentials...');
try{
let r=await wait(db.auth.signInWithPassword({
email:$('email').value.trim(),password:$('password').value
}));
if(r.error)throw r.error;
await init();
}catch(x){info('Login Error: '+x.message)}
finally{b.disabled=false;b.textContent='Secure Login'}
};
$('logout').onclick=async()=>{
await db.auth.signOut();
$('app').classList.add('hide');
$('login').classList.remove('hide');
$('logout').classList.add('hide');
info('Logged out');
};
$('site').onchange=()=>{edit=null;deleted=false;render()};
async function init(){
let u=await wait(db.auth.getUser());
if(u.error)throw u.error;
if(!u.data.user)return;
let p=await wait(db.from('staff_profiles').select('role,full_name').eq('user_id',u.data.user.id).single());
if(p.error)throw p.error;
role=p.data.role;
let s=await wait(db.from('sites').select('id,site_name').eq('is_active',true).order('site_name'));
if(s.error)throw s.error;
sites=s.data||[];
$('who').textContent=(p.data.full_name||'Staff')+' · '+role;
$('site').innerHTML=sites.map(x=>`<option value="${esc(x.id)}">${esc(x.site_name)}</option>`).join('');
$('login').classList.add('hide');
$('app').classList.remove('hide');
$('logout').classList.remove('hide');
await render();notice('Portal ready');
}
function field(f){
let [k,name,type,req]=f,v='';
if(type==='worker')
v='<select name="'+k+'" required><option value="">Select Worker</option>'+
workers.filter(w=>!w.is_deleted&&w.is_active!==false)
.map(w=>`<option value="${esc(w.id)}">${esc(w.full_name)}</option>`).join('')+'</select>';
else if(type==='cash')
v='<select name="'+k+'"><option value="cash_in">Cash In</option><option value="cash_out">Cash Out</option></select>';
else
v=`<input name="${k}" type="${type}" ${req?'required':''} ${type==='number'?'min="0" step="0.01"':''} ${type==='date'?'value="'+date()+'"':''}>`;
return `<label>${name}${req?' *':''}${v}</label>`;
}
function masterTools(){
  if(role!=='master'){
    $('content').textContent='Master Admin only';
    return;
  }
  const links=[
    ['Site Backup (Read Only)','AAW_Site_Backup_Master.html','Export site data to Excel; PDF inventory. Hard delete locked'],
    ['Incharge Management','incharge-test-fixed.html','Verified fixed listing · create accounts and reset passwords'],
    ['Site Assignment','site-assignment-test.html','Assign or change the site allocated to an incharge'],
    ['Incharge Access Control','incharge-access-test.html','Disable, enable and manage incharge login access'],
    ['Food Management','food-v518-fixed.html','Active workers only for new food entries; historical records preserved'],
    ['Salary Reconciliation','salary-test.html','Review calculations without creating salary payments'],
    ['Salary Guard Check','v519-guard-check.html','Run authenticated Master Admin guard diagnostic; no payment is retained']
  ];
  $('content').innerHTML='<h2>Master Admin Tools</h2><p class="muted">Separate secured test pages. No production deployment or database changes from these shortcuts.</p>'+
    links.map(([name,path,desc])=>`<div class="card"><h3>${esc(name)}</h3><p class="muted">${esc(desc)}</p><a style="display:inline-block;background:#ff752e;color:#102330;font-weight:bold;text-decoration:none;padding:12px 14px;border-radius:8px;max-width:100%;overflow-wrap:anywhere" href="${encodeURI(path)}" target="_blank" rel="noopener noreferrer">Open ${esc(name)} ↗</a></div>`).join('')+
    '<p class="muted">Note: Username is not shown when the source record has no username field. This does not affect the existing account. Live V5.8 remains unchanged. Salary payment saves are disabled in this test portal until the database guard is verified with an active test worker.</p>';
}

function productionPanel(site){
  const selected=sites.find(s=>String(s.id)===String(site));
  const siteName=selected?.name||selected?.site_name||'Selected Site';
  const productionUrl='AAW_Daily_Production_V526_Restore_Test.html?site_id='+encodeURIComponent(String(site));
  $('content').innerHTML=`<h2>Daily Production · V5.34</h2>
  <p class="muted">${esc(siteName)} · Secure Supabase Production Register. The V5.26 production page independently verifies the signed-in account and assigned sites. Production entry and report are locked to this selected site. Switch sites using the main portal selector.</p>
  <div class="card">
    <div class="actions"><a href="${productionUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#ff752e;color:#102330;font-weight:800;padding:12px 15px;border-radius:8px;text-decoration:none">Open Full Screen / Print PDF ↗</a></div>
    <p class="muted">Entry, Edit, Archive, Restore, History, CSV export and reports appear below. PDF printing works best in full screen. Switch the main portal site to update both the entry form and report. The embedded page may require a fresh login if the browser restricts sessions.</p>
    <iframe title="Secure Daily Production Register" src="${productionUrl}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" style="width:100%;height:78vh;min-height:660px;border:1px solid #36596b;border-radius:9px;background:#071b28" ></iframe>
  </div>
  <p class="muted">V5.34 integration test · Live V5.8 unchanged · Salary payment saving locked · Daily Production bundled in deployment ZIP.</p>`;
}

function billingPanel(){
  if(role!=='master'){
    $('content').textContent='Master Admin only';
    return;
  }
  const url='AAW_Billing_Studio_Final.html';
  $('content').innerHTML=`<h2>Company Documents & Billing Studio</h2>
  <p class="muted">Master Admin workspace · Approved Blue + White Corporate design. Letterhead, Invoice, Quotation, Work Proforma and Measurement Bill.</p>
  <div class="card"><div class="actions"><a href="${url}" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#ff752e;color:#102330;font-weight:800;padding:12px 15px;border-radius:8px;text-decoration:none">Open Billing Studio Full Screen ↗</a></div>
  <p class="muted">Cloud status and online document saving are shown inside Billing Studio. Master Admin only; PDF via Print / Save as PDF. Previous V1/V2 local drafts require manual backup/import.</p>
  <iframe title="Company Documents and Billing Studio" src="${url}" loading="lazy" style="width:100%;height:83vh;min-height:720px;border:1px solid #36596b;border-radius:9px;background:white"></iframe></div>`;
}

async function render(){
let n=++seq,site=$('site').value;
if(!site){$('content').textContent='No assigned sites';return}
let allowed=tabs.filter(x=>role==='master'||!['summary','slip','ledger','mastertools','billing'].includes(x[0]));
if(!allowed.some(x=>x[0]===tab))tab='workers';
$('tabs').innerHTML=allowed.map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
tab=b.dataset.tab;edit=null;deleted=false;render();
});
let w=await db.from('workers').select('id,full_name,is_active,is_deleted').eq('site_id',site).order('full_name');
if(n!==seq)return;
if(w.error){notice(w.error.message);return}
workers=w.data||[];
if(tab==='summary')return summary(site);
if(tab==='attendance')return attendance(site);
if(tab==='report')return monthlyReport(site);
if(tab==='slip')return salarySlip(site);
if(tab==='food')return foodDeduction(site);
if(tab==='foodmanage')return foodManagement(site);
if(tab==='salary')return salaryPayment(site);
if(tab==='mastertools')return masterTools();
if(tab==='production')return productionPanel(site);
if(tab==='billing')return billingPanel();
let [table,fields]=config[tab];
let order=tab==='workers'?'created_at':(fields.find(f=>f[2]==='date')||['created_at'])[0];
let r=await db.from(table).select('*').eq('site_id',site).order(order,{ascending:false}).limit(100);
if(n!==seq)return;
if(r.error){notice(r.error.message);return}
let rows=(r.data||[]).filter(x=>tab!=='workers'||(deleted?x.is_deleted===true:x.is_deleted!==true));
let can=role==='master'||['workers','advances','expenses'].includes(tab);
$('content').innerHTML=`<h2>${allowed.find(x=>x[0]===tab)[1]}</h2>
${tab==='workers'&&role==='master'?`<button id="showDeleted" class="alt">${deleted?'Show Workers':'Deleted Workers / Restore'}</button>`:''}
<div id="rows"></div><h3 id="formTitle">New Entry</h3><form id="form" class="grid"></form>`;
if($('showDeleted'))$('showDeleted').onclick=()=>{deleted=!deleted;edit=null;render()};
$('rows').innerHTML=rows.length?rows.map(x=>{
let name=x.full_name||workers.find(w=>String(w.id)===String(x.worker_id))?.full_name||x.category||x.entry_type||'Entry';
let detail=Object.entries(x).filter(([k,v])=>!['id','site_id','worker_id','created_at'].includes(k)&&v!==null).map(([k,v])=>k+': '+v).join(' · ');
let buttons='';
if(tab==='workers')
buttons=x.is_deleted
?(role==='master'?`<button data-restore="${esc(x.id)}">Restore</button>`:'')
:`<div class="actions"><button class="alt" data-edit="${esc(x.id)}">Edit</button><button class="alt" data-active="${esc(x.id)}">${x.is_active===false?'Reactivate':'Deactivate'}</button>${role==='master'?`<button data-delete="${esc(x.id)}">Delete from List</button>`:''}</div>`;
return `<div class="card"><b>${esc(name)}</b><small>${esc(detail)}</small>${buttons}</div>`;
}).join(''):'<p class="muted">No entries</p>';
let form=$('form');
if(!can||(tab==='workers'&&deleted))
form.innerHTML='<p class="muted">No entry form available</p>';
else{
form.innerHTML=fields.map(field).join('')+'<div class="actions"><button id="save">Save Entry</button><button type="button" class="alt" id="cancel">Cancel Edit</button></div>';
$('cancel').onclick=()=>{edit=null;render()};
form.onsubmit=async e=>{
e.preventDefault();$('save').disabled=true;
let data={site_id:site};
fields.forEach(([k,,type])=>{
let v=form.elements[k].value;
if(v!=='')data[k]=type==='number'?Number(v):v;
else if(edit&&tab==='workers')data[k]=null;
});
try{
let q=edit&&tab==='workers'
?db.from(table).update(data).eq('id',edit).eq('site_id',site).select('id')
:db.from(table).insert(data).select('id');
let r=await q;
if(r.error)throw r.error;
if(!r.data?.length)throw Error('Permission denied');
edit=null;await render();notice('Saved successfully');
}catch(e){notice('Save Error: '+e.message);$('save').disabled=false}
};
}
if(tab!=='workers')return;
$('rows').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
let x=rows.find(r=>String(r.id)===b.dataset.edit);edit=x.id;
fields.forEach(([k])=>{if(form.elements[k])form.elements[k].value=x[k]??''});
$('formTitle').textContent='Edit '+x.full_name;
$('save').textContent='Update Worker';
form.scrollIntoView({behavior:'smooth'});
});
$('rows').querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{
let x=rows.find(r=>String(r.id)===b.dataset.active),active=x.is_active===false;
if(!confirm((active?'Reactivate ':'Deactivate ')+x.full_name+'?'))return;
let r=await db.from('workers').update({is_active:active}).eq('id',x.id).eq('site_id',site).select('id');
if(r.error||!r.data?.length){notice(r.error?.message||'Update denied');return}
await render();notice('Worker updated');
});
$('rows').querySelectorAll('[data-delete],[data-restore]').forEach(b=>b.onclick=async()=>{
let restoring=!!b.dataset.restore,id=b.dataset.restore||b.dataset.delete;
let x=rows.find(r=>String(r.id)===String(id));
if(!confirm((restoring?'Restore ':'Delete from list: ')+x.full_name+'?'))return;
let data=restoring?{is_deleted:false,deleted_at:null}:{is_deleted:true,deleted_at:new Date().toISOString()};
let r=await db.from('workers').update(data).eq('id',id).eq('site_id',site).eq('is_deleted',restoring).select('id');
if(r.error||!r.data?.length){notice(r.error?.message||'Update denied');return}
await render();notice(restoring?'Restored':'Deleted from list; history kept');
});
}

/* Shared salary calculation */
async function salaryData(site,from,to,id='all'){
if(!from||!to||from>to)throw Error('Invalid salary dates');
let a=db.from('worker_attendance').select('worker_id,status,overtime_hours').eq('site_id',site).gte('attendance_date',from).lte('attendance_date',to);
let b=db.from('worker_advances').select('worker_id,amount,notes').eq('site_id',site).gte('advance_date',from).lte('advance_date',to);
let c=db.from('worker_salary_payments').select('worker_id,amount').eq('site_id',site).lte('period_start',to).gte('period_end',from);
if(id!=='all'){a=a.eq('worker_id',id);b=b.eq('worker_id',id);c=c.eq('worker_id',id)}
const r=await Promise.all([
 a.range(0,9999),b.range(0,9999),c.range(0,9999),
 db.rpc('get_final_food_deductions',{p_site_id:site,p_start:from,p_end:to})
]);
for(const x of r){if(x.error)throw x.error}
for(const x of r.slice(0,3)){if(x.data.length===10000)throw Error('Use shorter salary period')}
return {attendance:r[0].data||[],advances:r[1].data||[],payments:r[2].data||[],finalFood:r[3].data||[]};
}
function calculateWorker(w,data){
let match=x=>String(x.worker_id)===String(w.id);
let att=data.attendance.filter(match),adv=data.advances.filter(match),pay=data.payments.filter(match);
let final=(data.finalFood||[]).filter(match);
let days=att.reduce((n,x)=>n+(x.status==='present'?1:x.status==='half_day'?0.5:0),0);
let ot=att.reduce((n,x)=>n+Number(x.overtime_hours||0),0);
let wage=days*Number(w.daily_wage||0),otPay=ot*Number(w.overtime_rate||0);
let isFood=x=>String(x.notes||'').trim().toUpperCase().startsWith('FOOD:');
let manualFood=adv.filter(isFood).reduce((n,x)=>n+Number(x.amount||0),0);
let advance=adv.filter(x=>!isFood(x)).reduce((n,x)=>n+Number(x.amount||0),0);
let finalFood=final.reduce((n,x)=>n+Number(x.deduction_amount||0),0);
let paid=pay.reduce((n,x)=>n+Number(x.amount||0),0);
let gross=wage+otPay,food=manualFood+finalFood,due=gross-advance-food-paid;
return {days,ot,wage,otPay,manualFood,finalFood,food,advance,paid,gross,due};
}

let r=await db.from('workers').select('id,full_name,daily_wage,overtime_rate,is_deleted,is_active').eq('site_id',site).order('full_name');

return r.data||[];
}

async function attendance(site){
let active=workers.filter(w=>!w.is_deleted&&w.is_active!==false);
$('content').innerHTML=`<h2>Bulk Attendance</h2>
<label>Date<input type="date" id="ad" value="${date()}"></label>
<div class="actions">
<button id="load" class="alt">Load Attendance</button>
<button id="present" class="alt">Mark All Present</button>
</div>
<div id="alist"></div><button id="saveAtt" disabled>Save All Attendance</button>`;
let saved=new Map(),loaded='',duplicates=false;
async function load(){
loaded='';$('saveAtt').disabled=true;
try{
let day=$('ad').value;
let r=await db.from('worker_attendance').select('id,worker_id,status,overtime_hours').eq('site_id',site).eq('attendance_date',day).range(0,9999);
if(r.error)throw r.error;
if(r.data.length===10000)throw Error('Too many records');
saved=new Map();duplicates=false;
r.data.forEach(x=>{
let k=String(x.worker_id);
if(saved.has(k))duplicates=true;else saved.set(k,x);
});
$('alist').innerHTML=active.map(w=>{
let x=saved.get(String(w.id)),s=x?.status||'present';
return `<div class="att" data-id="${esc(w.id)}"><b>${esc(w.full_name)}</b><div class="grid">
<label>Status<select class="as">${[['present','Present'],['absent','Absent'],['half_day','Half Day'],['leave','Leave']].map(([v,n])=>`<option value="${v}" ${s===v?'selected':''}>${n}</option>`).join('')}</select></label>
<label>OT Hours<input class="ao" type="number" min="0" step="0.5" value="${Number(x?.overtime_hours||0)}"></label></div></div>`;
}).join('');
$('alist').querySelectorAll('.as').forEach(s=>s.onchange=()=>{
if(['absent','leave'].includes(s.value))s.closest('.att').querySelector('.ao').value=0;
});
loaded=day;$('saveAtt').disabled=duplicates||!active.length;
notice(duplicates?'Duplicate attendance found; saving disabled':'Attendance loaded: '+day);
}catch(e){notice('Load Error: '+e.message)}
}
$('load').onclick=load;
$('ad').onchange=()=>{loaded='';$('saveAtt').disabled=true;$('alist').innerHTML='Press Load Attendance'};
$('present').onclick=()=>{
$('alist').querySelectorAll('.as').forEach(s=>s.value='present');
notice('Marked Present; press Save All');
};
$('saveAtt').onclick=async()=>{
if(loaded!==$('ad').value||duplicates)return;
let rows=[...$('alist').querySelectorAll('.att')];
let entries=rows.map(x=>{
let s=x.querySelector('.as').value,ot=Number(x.querySelector('.ao').value);
return {id:x.dataset.id,status:s,ot:['absent','leave'].includes(s)?0:ot};
});
if(entries.some(x=>!Number.isFinite(x.ot)||x.ot<0)){notice('Invalid OT');return}
if(!confirm('Save '+entries.length+' workers attendance for '+loaded+'?'))return;
$('saveAtt').disabled=true;let ok=0,errors=[];
for(let x of entries){
let old=saved.get(String(x.id));
let r=old
?await db.from('worker_attendance').update({status:x.status,overtime_hours:x.ot}).eq('id',old.id).eq('site_id',site).select('id')
:await db.from('worker_attendance').insert({site_id:site,worker_id:x.id,attendance_date:loaded,status:x.status,overtime_hours:x.ot}).select('id');
if(r.error||!r.data?.length)errors.push(r.error?.message||'Permission denied');else ok++;
}
notice(ok+' Saved; '+errors.length+' Failed'+(errors.length?'\n'+errors.slice(0,3).join('\n'):''));
if(!errors.length)await load();
};
await load();
}
async function monthlyReport(site){
let month=date().slice(0,7);
$('content').innerHTML=`<h2>Monthly Attendance Report</h2>
<div class="grid">
<label>Month<input id="rm" type="month" value="${month}"></label>
<label>Worker<select id="rw"></select></label>
</div>
<button id="runReport">Generate Report</button>
<div id="reportResult"></div>`;
try{
let list=await fullWorkers(site);
$('rw').innerHTML=workerOptions(list,true);
$('runReport').onclick=async()=>{
let m=$('rm').value,id=$('rw').value;
if(!/^\d{4}-\d{2}$/.test(m)){notice('Select valid month');return}
let [year,mo]=m.split('-').map(Number);
let from=m+'-01',to=new Date(Date.UTC(year,mo,0)).toISOString().slice(0,10);
$('runReport').disabled=true;notice('Generating report...');
try{
let records=[],offset=0;
while(true){
let q=db.from('worker_attendance').select('worker_id,attendance_date,status,overtime_hours')
.eq('site_id',site).gte('attendance_date',from).lte('attendance_date',to)
.order('attendance_date').range(offset,offset+999);
if(id!=='all')q=q.eq('worker_id',id);
let r=await q;if(r.error)throw r.error;
records.push(...r.data);
if(r.data.length<1000)break;
offset+=1000;
if(offset>=20000)throw Error('Too many records');
}
let total={p:0,a:0,h:0,l:0,days:0,ot:0};
let rows=list.filter(w=>id==='all'||String(w.id)===id).map(w=>{
let a=records.filter(x=>String(x.worker_id)===String(w.id));
let p=a.filter(x=>x.status==='present').length;
let ab=a.filter(x=>x.status==='absent').length;
let h=a.filter(x=>x.status==='half_day').length;
let l=a.filter(x=>x.status==='leave').length;
let days=p+h*.5,ot=a.reduce((n,x)=>n+Number(x.overtime_hours||0),0);
total.p+=p;total.a+=ab;total.h+=h;total.l+=l;total.days+=days;total.ot+=ot;
return `<tr><td>${esc(w.full_name)}</td><td>${p}</td><td>${ab}</td><td>${h}</td><td>${l}</td><td>${days}</td><td>${ot}</td></tr>`;
}).join('');
$('reportResult').innerHTML=`<div class="card"><b>${esc(m)} · Monthly Attendance</b></div>
<div class="wrap"><table><thead><tr><th>Worker</th><th>P</th><th>A</th><th>H</th><th>L</th><th>Paid Days</th><th>OT</th></tr></thead>
<tbody>${rows}<tr><th>Total</th><th>${total.p}</th><th>${total.a}</th><th>${total.h}</th><th>${total.l}</th><th>${total.days}</th><th>${Number(total.ot.toFixed(2))}</th></tr></tbody></table></div>
<p class="muted">Only saved attendance counts. Missing days are not automatically Absent.</p>`;
notice('Monthly report ready');
}catch(e){notice('Report Error: '+e.message)}
finally{$('runReport').disabled=false}
};
}catch(e){notice('Report Error: '+e.message)}
}

const bytes=Uint8Array.from(atob(EMBEDDED_FOOD_HTML),c=>c.charCodeAt(0));
return new TextDecoder().decode(bytes);
}
async function foodManagement(site){
$('content').innerHTML='<h2>Food Management · V5.18</h2><p class="muted">New food periods only for active workers. Archived worker history remains available. This is a separate test module.</p><p><a href="food-v518-fixed.html" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#ff752e;color:#102330;font-weight:bold;text-decoration:none;padding:12px;border-radius:8px">Open Food Management ↗</a></p>';
notice('Food Management loaded');
}
async function salaryPayment(site){
if(!['master','incharge'].includes(role)){notice('Salary access denied');return}
const d=date();
$('content').innerHTML=`<h2>Salary Payments · Balance & Payment Register</h2>
<p class="muted">Finalized food deductions, advances and earlier payments are included. The database must independently reject overpayments. Save only genuine salary payments.</p>
<label>Worker<select id="pw"></select></label>
<div class="grid"><label>Period From<input id="pf" type="date" value="${d.slice(0,7)}-01"></label>
<label>Period To<input id="pt" type="date" value="${d}"></label></div>
<button class="alt" id="pc">Calculate Payable</button><div id="payPreview"></div>
<label>Payment Date<input id="pd" type="date" value="${d}"></label>
<label>Amount ₹<input id="pa" type="number" min="0.01" step="0.01" placeholder="Amount"></label>
<label>Notes<input id="pn" type="text" placeholder="Payment reference / remarks"></label>
<div class="actions"><button id="ps" disabled>Calculate Before Saving</button><button class="alt" id="pr">Refresh History</button></div>
<div id="ph"></div>`;
let list=await fullWorkers(site);list=list.filter(x=>!x.is_deleted&&x.is_active!==false);
$('pw').innerHTML=workerOptions(list);
let verified=null;
let savingSalary=false;
const invalidate=()=>{verified=null;$('ps').disabled=true;$('ps').textContent='Calculate Before Saving';$('payPreview').textContent='';};
for(const key of ['pw','pf','pt','pd'])$(key).addEventListener('change',invalidate);
const history=async()=>{
let worker=$('pw').value;if(!worker){$('ph').textContent='Select worker';return}
let r=await db.from('worker_salary_payments').select('payment_date,period_start,period_end,amount,notes')
.eq('site_id',site).eq('worker_id',worker).order('payment_date',{ascending:false}).limit(100);
if(r.error)throw r.error;
$('ph').innerHTML='<h3>Previous Salary Payments</h3>'+((r.data||[]).map(x=>
`<div class="card"><b>${cash(x.amount)}</b><small>Paid: ${esc(x.payment_date)} · Period: ${esc(x.period_start)} to ${esc(x.period_end)}</small><small>${esc(x.notes||'')}</small></div>`).join('')||'<p class="muted">No payments</p>');
};
const calculate=async()=>{
const worker=$('pw').value,from=$('pf').value,to=$('pt').value;
if(!worker||!from||!to||from>to)throw Error('Select a worker and valid period');
const w=list.find(x=>String(x.id)===worker);if(!w)throw Error('Worker not active');
const data=await salaryData(site,from,to,worker),x=calculateWorker(w,data);
const due=Math.round(x.due*100)/100;
verified={worker,from,to,due};
$('payPreview').innerHTML=`<div class="card"><b>${esc(w.full_name)}</b>
<small>Wages ${cash(x.wage)} + OT ${cash(x.otPay)} = Gross ${cash(x.gross)}</small>
<small>Advances ${cash(x.advance)} · Manual Food ${cash(x.manualFood)} · Final Food ${cash(x.finalFood)} · Already Paid ${cash(x.paid)}</small>
<b>Available Balance: ${cash(due)}</b></div>`;
$('ps').disabled=!(due>0);$('ps').textContent=due>0?'Save Actual Salary Payment':'No Positive Balance';
return verified;
};
$('pc').onclick=async()=>{try{await calculate();notice('Salary calculated. Check all deductions.')}catch(e){invalidate();notice('Calculation Error: '+e.message)}};
$('pr').onclick=async()=>{try{await history()}catch(e){notice(e.message)}};
$('ps').onclick=async()=>{
if(!verified||savingSalary)return;
const amount=Number($('pa').value),payment_date=$('pd').value;
if(!Number.isFinite(amount)||amount<=0||Math.abs(Math.round(amount*100)-amount*100)>0.000001||!payment_date){notice('Enter valid date and positive amount with at most 2 decimals');return}
if(payment_date<verified.from||payment_date>verified.to){notice('Payment date must be within salary period');return}
$('ps').disabled=true;savingSalary=true;
try{
// Re-read balances immediately before inserting; server trigger must enforce the limit atomically.
const old={...verified};const fresh=await calculate();
if(old.worker!==fresh.worker||old.from!==fresh.from||old.to!==fresh.to)throw Error('Worker or period changed');
if(amount>fresh.due+0.00001)throw Error('Amount exceeds outstanding balance');
if(!confirm(`SAVE ACTUAL SALARY PAYMENT?\nAmount: ${cash(amount)}\nOutstanding before payment: ${cash(fresh.due)}\nThis creates a permanent financial record.`))return;
const payload={worker_id:fresh.worker,site_id:site,payment_date,period_start:fresh.from,period_end:fresh.to,amount,notes:$('pn').value.trim()||null};
const r=await db.from('worker_salary_payments').insert(payload).select('worker_id,amount');
if(r.error)throw r.error;
if(!r.data||r.data.length!==1)throw Error('Payment not confirmed by server');
notice('Salary payment saved online');$('pa').value='';invalidate();try{await history()}catch(histErr){notice('Payment saved online; history refresh failed: '+histErr.message)}
}catch(e){notice('Salary payment NOT confirmed: '+e.message)}
finally{savingSalary=false;if(verified)$('ps').disabled=!(verified.due>0)}
};
try{await history()}catch(e){notice(e.message)}
}
loadLibrary();
</script>
