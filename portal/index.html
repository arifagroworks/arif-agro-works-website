footer{
  color:#91aeba;
  text-align:center;
  padding:20px;
  font-size:12px;

@media(max-width:540px){

  );

<script>
/* CDN loader independent of the portal application. */
window.portalLibraryReady = false;

(function() {
  var sources = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js",
    "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  ];

  var index = 0;

  function tryNext() {
    if (window.supabase &&
        typeof window.supabase.createClient === "function") {
      window.portalLibraryReady = true;
      window.portalStatus("Step 2: Supabase library ready");
      window.dispatchEvent(new Event("portal-library-ready"));
      return;
    }

    if (index >= sources.length) {
      window.portalStatus(
        "Library Error: Supabase CDN नहीं खुला।"
      );
      return;
    }

    var number = index + 1;
    var script = document.createElement("script");
    var finished = false;

    window.portalStatus(
      "Step 2: Loading Supabase library " + number
    );

    var timer = setTimeout(function() {
      if (finished) return;
      finished = true;
      script.remove();
      tryNext();
    }, 10000);

    script.onload = function() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      tryNext();
    };

    script.onerror = function() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      tryNext();
    };

    script.src = sources[index++];
    document.head.appendChild(script);
  }

  tryNext();
})();
</script>

/* LOGIN */

function setLoginBusy(value) {
  loginBusy = value;
  el("signin").disabled = value;
  el("signin").textContent =
    value ? "Logging in..." : "Secure Login";
}

async function startClient() {
  if (db) return;

  try {
    if (!window.supabase ||
        typeof window.supabase.createClient !== "function") {
      throw new Error("Supabase library unavailable");
    }

    loginStatus("Step 3: Creating secure connection");

    db = window.supabase.createClient(URL,KEY,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false
      }
    });

    setLoginBusy(false);
    loginStatus("Login service ready. Secure Login दबाएँ।");

    var sessionResult = await withTimeout(
      db.auth.getSession(),12000,"Session"
    );

    if (sessionResult.error) throw sessionResult.error;

    if (sessionResult.data.session) {
      loginStatus("Existing login found. Opening portal...");
      await withTimeout(init(),15000,"Portal");
    }

  } catch(error) {
    setLoginBusy(false);
    loginStatus("Startup Error: "+error.message);
  }
}

window.addEventListener(
  "portal-library-ready",
  startClient
);

if (window.portalLibraryReady) {
  startClient();
}

el("loginForm").addEventListener("submit",async function(event) {
  event.preventDefault();

  if (loginBusy) return;

  if (!db) {
    loginStatus("Login service अभी तैयार नहीं है।");
    return;
  }

  var email = el("email").value.trim();
  var password = el("password").value;

  if (!email || !password) {
    loginStatus("Email और Password भरें।");
    return;
  }

  setLoginBusy(true);
  loginStatus("Checking login credentials...");

  try {
    var result = await withTimeout(
      db.auth.signInWithPassword({
        email:email,
        password:password
      }),
      15000,
      "Login"
    );

    if (result.error) throw result.error;

    loginStatus("Login successful. Loading sites...");

    await withTimeout(init(),15000,"Portal");

  } catch(error) {
    loginStatus("Login Error: "+error.message);
  } finally {
    setLoginBusy(false);
  }
});

el("logout").onclick = async function() {
  try {

    hide("app",true);

/* LOAD STAFF PROFILE */

async function init() {
  var userResult = await db.auth.getUser();

  if (userResult.error) throw userResult.error;

  var user = userResult.data.user;

  if (!user) {
    hide("login",false);
    hide("app",true);
    return;
  }

  var profileResult = await db
    .from("staff_profiles")
    .select("role,full_name")
    .eq("user_id",user.id)
    .single();

  if (profileResult.error) {
    throw new Error(
      "Profile: "+profileResult.error.message
    );
  }

  role = profileResult.data.role;

  var sitesResult = await db
    .from("sites")
    .select("id,site_name")
    .eq("is_active",true)
    .order("site_name");

  if (sitesResult.error) {
    throw new Error(
      "Sites: "+sitesResult.error.message
    );
  }

  sites = sitesResult.data || [];

  el("who").textContent =
    (profileResult.data.full_name || "Staff")+
    " · "+role;

  var previous = el("site").value;

  el("site").innerHTML = sites.map(function(site) {
    return '<option value="'+escapeHTML(site.id)+'">'+
      escapeHTML(site.site_name)+'</option>';
  }).join("");

  if (sites.some(function(site) {
    return String(site.id) === previous;
  })) {
    el("site").value = previous;
  }

  hide("login",true);
  hide("app",false);
  hide("logout",false);

  await render();
  status("Welcome to Portal V5.5");
}

function fieldHTML(field) {
  var key = field[0];
  var label = field[1];
  var type = field[2];
  var required = field[3];
  var input = "";

  if (type === "worker") {
    input = '<select name="'+key+'" '+
      (required ? "required" : "")+'>'+
      '<option value="">Choose worker</option>'+
      workers.filter(function(worker) {
        return worker.is_deleted !== true &&
          worker.is_active !== false;
      }).map(function(worker) {
        return '<option value="'+escapeHTML(worker.id)+'">'+
          escapeHTML(worker.full_name)+'</option>';
      }).join("")+
      '</select>';

  } else if (type === "cash") {
    input =
      '<select name="'+key+'">'+
      '<option value="cash_in">Cash in</option>'+
      '<option value="cash_out">Cash out</option>'+
      '</select>';

  } else {
    input =
      '<input name="'+key+'" type="'+type+'" '+
      (required ? "required " : "")+
      (type === "number" ? 'step="0.01" min="0" ' : "")+
      (type === "date" ? 'value="'+today()+'" ' : "")+
      '>';
  }

  return '<label>'+escapeHTML(label)+
    (required ? " *" : "")+input+'</label>';
}

/* SALARY SUMMARY */

async function renderSummary(site) {
  var currentDate = today();
  var monthStart = currentDate.slice(0,7)+"-01";

  el("content").innerHTML =
    '<h2>Salary Summary</h2>'+
    '<p class="muted">Single Worker या All Workers</p>'+
    '<label>Worker चुनें'+
    '<select id="salaryWorker">'+
    '<option value="all">All Workers — सबकी Salary</option>'+
    '</select></label>'+
    '<div class="grid">'+
    '<label>From<input id="fromDate" type="date" value="'+
      monthStart+'"></label>'+
    '<label>To<input id="toDate" type="date" value="'+
      currentDate+'"></label>'+
    '</div>'+
    '<button id="calculate" type="button">Calculate Salary</button>'+
    '<p class="muted">Calculation current Daily Wage और OT Rate पर आधारित है।</p>'+
    '<div id="salaryResults"></div>';

  var result = await db
    .from("workers")
    .select("id,full_name,daily_wage,overtime_rate,is_deleted")
    .eq("site_id",site)
    .order("full_name");

  if (result.error) {
    status(result.error.message);
    return;
  }

  var workerList = result.data || [];

  el("salaryWorker").innerHTML =
    '<option value="all">All Workers — सबकी Salary</option>'+
    workerList.map(function(worker) {
      return '<option value="'+escapeHTML(worker.id)+'">'+
        escapeHTML(worker.full_name)+
        (worker.is_deleted ? " (Archived)" : "")+
        '</option>';
    }).join("");

  el("salaryWorker").onchange = function() {
    el("salaryResults").innerHTML = "";
  };

  el("calculate").onclick = async function() {
    var start = el("fromDate").value;
    var end = el("toDate").value;
    var selected = el("salaryWorker").value;

    if (!start || !end || start > end) {
      status("Valid dates चुनें।");
      return;
    }

    var selectedWorkers = workerList.filter(function(worker) {
      return selected === "all" ||
        String(worker.id) === selected;
    });

    if (!selectedWorkers.length) {
      status("Worker नहीं मिला।");
      return;
    }

    el("calculate").disabled = true;
    status("Calculating salary...");

    try {
      var attendanceQuery = db
        .from("worker_attendance")
        .select("worker_id,status,overtime_hours")
        .eq("site_id",site)
        .gte("attendance_date",start)
        .lte("attendance_date",end);

      var advanceQuery = db
        .from("worker_advances")
        .select("worker_id,amount")
        .eq("site_id",site)
        .gte("advance_date",start)
        .lte("advance_date",end);

      var paymentQuery = db
        .from("worker_salary_payments")
        .select("worker_id,amount")
        .eq("site_id",site)
        .gte("payment_date",start)
        .lte("payment_date",end);

      if (selected !== "all") {
        attendanceQuery = attendanceQuery.eq("worker_id",selected);
        advanceQuery = advanceQuery.eq("worker_id",selected);
        paymentQuery = paymentQuery.eq("worker_id",selected);
      }

      var results = await Promise.all([
        attendanceQuery.range(0,9999),
        advanceQuery.range(0,9999),
        paymentQuery.range(0,9999)
      ]);

      for (var i=0;i<results.length;i++) {
        if (results[i].error) throw results[i].error;
        if (results[i].data.length >= 10000) {
          throw new Error("Date range छोटा करें।");
        }
      }

      var attendance = results[0].data;
      var advances = results[1].data;
      var payments = results[2].data;

      function sumWorker(rows,id,key) {
        return rows.filter(function(row) {
          return String(row.worker_id) === String(id);
        }).reduce(function(total,row) {
          return total+Number(row[key] || 0);
        },0);
      }

      var grandTotal = 0;

      var html = selectedWorkers.map(function(worker) {
        var records = attendance.filter(function(row) {
          return String(row.worker_id) === String(worker.id);
        });

        var days = records.reduce(function(total,row) {
          if (row.status === "present") return total+1;
          if (row.status === "half_day") return total+0.5;
          return total;
        },0);

        var otHours = sumWorker(
          records,worker.id,"overtime_hours"
        );

        var wages = days*Number(worker.daily_wage || 0);
        var otPay = otHours*Number(worker.overtime_rate || 0);
        var advance = sumWorker(
          advances,worker.id,"amount"
        );
        var paid = sumWorker(
          payments,worker.id,"amount"
        );

        var balance = wages+otPay-advance-paid;
        grandTotal += balance;

        return '<div class="item">'+
          '<strong>'+escapeHTML(worker.full_name)+
          (worker.is_deleted ? " (Archived)" : "")+
          '</strong>'+
          '<small>Paid days: '+days+
          ' · OT hours: '+otHours+'</small>'+
          '<small>Wages '+money(wages)+
          ' + OT '+money(otPay)+
          ' − Advance '+money(advance)+
          ' − Paid '+money(paid)+'</small>'+
          '<strong>Balance: '+money(balance)+'</strong>'+
          '</div>';
      }).join("");

      html += '<div class="item"><strong>'+
        (selected === "all"
          ? "Total Balance: "
          : "Selected Worker Balance: ")+
        money(grandTotal)+'</strong></div>';

      el("salaryResults").innerHTML = html;
      status("Salary calculation ready.");

    } catch(error) {
      status("Salary Error: "+error.message);
    } finally {
      el("calculate").disabled = false;
    }
  };
}

    '<p id="attInfo" class="muted"></p>';

  var existing = new Map
