
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arif Agro Works | Blue Management Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b28;color:#eef6fa;font-family:Arial,sans-serif}
header{background:#103044;border-bottom:3px solid #ff752e;padding:16px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:17px}
small,.muted{color:#abc3ce}
main{max-width:900px;margin:18px auto;padding:0 12px}
.box{background:#103044;border:1px solid #36596b;border-radius:13px;padding:15px;margin-bottom:14px}
label{display:block;font-size:13px;color:#c7dce5;margin:10px 0}
input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #567487;border-radius:7px;background:#071e2d;color:white;font-size:16px}
button{padding:10px 13px;background:#ff752e;border:0;border-radius:8px;color:#102330;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.alt{background:#284b60;color:white}
.hide{display:none!important}
.tabs,.actions{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.tabs button{background:#284b60;color:white;font-size:13px}
.tabs button.active{background:#ff752e;color:#102330}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{padding:12px;background:#092333;border:1px solid #36596b;border-radius:9px;margin:9px 0;overflow-wrap:anywhere}
.card small{display:block;margin:5px 0}
#notice,#loginMsg{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffccaa;margin:12px 0;font-size:13px}
.atimes[hidden]{display:none}.att{border-bottom:1px solid #36596b;padding:10px 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #36596b;padding:9px 5px;text-align:center}
th{background:#284b60}
th:first-child,td:first-child{text-align:left}
.slip{background:#fff;color:#111;padding:20px;border-radius:8px;margin-top:12px}
.slip h2,.slip h3{text-align:center}
.slip table th{background:#eee;color:#111}
.slip table td,.slip table th{border-color:#aaa}
.slip .muted{color:#555}
footer{text-align:center;color:#abc3ce;font-size:12px;padding:20px}


/* AAW Blue Corporate preview skin — no database or calculation changes */
body{background:#041024;color:#eaf5ff;font-family:Manrope,Arial,sans-serif;background-image:radial-gradient(circle at 90% 0%,#0b3d6c55,transparent 45%)}
header{background:#05172f;border-bottom:2px solid #12a8ff;box-shadow:0 5px 25px #007bff28}
header b{font-family:Rajdhani,Arial,sans-serif;font-size:22px;letter-spacing:1px}header b span{color:#18aaff!important}
.box{background:linear-gradient(140deg,#092644,#071b33);border:1px solid #175c91;box-shadow:0 5px 25px #0002}
.card{background:#061a30;border-color:#155386}
button{background:linear-gradient(120deg,#0875d4,#19b8ff);color:#fff;box-shadow:0 0 12px #0c9eff25}
.alt,.tabs button{background:#153c60;color:#eaf5ff;box-shadow:none}
.tabs button.active{background:#16a8fa;color:#031326}
input,select,textarea{background:#04182c;border-color:#1b6498;color:#fff}
th{background:#153c60}th,td{border-color:#17507e}
#notice,#loginMsg{color:#91d9ff}
@media(max-width:600px){header{padding:14px}main{padding:0 10px}.box{padding:13px}}

/* Blue final: contrast and mobile usability refinements */
header b{color:#f3f9ff}header small{color:#b9ddf4}
#login{max-width:500px;margin:36px auto}
#app>.box:first-child{border-top:3px solid #18aaff}
.tabs button{min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid #31b5ff;outline-offset:1px}
.slip{background:#fff;color:#111}.slip .muted{color:#555}
.slip th,.slip td{color:#111;border-color:#aaa}.slip th{background:#eee}
@media(max-width:600px){.tabs button{flex:1 1 auto}main{margin:14px auto}}

/* Approved AAW green / white brand skin. Presentation only: business JS unchanged. */
:root{color-scheme:light;--aaw-green:#087b45;--aaw-deep:#06462e;--aaw-ink:#142a24;--aaw-border:#d9e9e0;--aaw-paper:#fff;--aaw-muted:#60756b}
html{scroll-behavior:smooth}
body{background:#f3f8f5;background-image:radial-gradient(circle at 92% 2%,#d9f4e5 0%,transparent 42%);color:var(--aaw-ink);font-family:Arial,system-ui,sans-serif;min-height:100vh}
header{background:linear-gradient(115deg,#fff 0%,#f4fcf7 100%);border-bottom:3px solid #138d52;box-shadow:0 4px 24px #06462e13;padding:13px clamp(14px,3vw,36px);gap:12px}
header .brand{display:flex;align-items:center;gap:13px;min-width:0}
header .brand-logo{width:104px;max-width:27vw;height:64px;object-fit:contain;flex-shrink:0;mix-blend-mode:multiply}
header b{font-family:Arial,system-ui,sans-serif;font-size:clamp(18px,2.2vw,25px);font-weight:900;letter-spacing:.5px;color:#14382a}
header b span{color:#087b45!important}
header small{display:block;color:#56766a;font-size:11px;letter-spacing:.3px;line-height:1.5}
main{max-width:1220px;width:100%;margin:25px auto;padding:0 clamp(12px,2.4vw,28px)}
.box{background:#fff;border:1px solid var(--aaw-border);border-radius:16px;box-shadow:0 8px 28px #134d2c0d;padding:clamp(15px,2vw,23px);margin-bottom:18px}
#app>.box:first-child{border-top:4px solid #119457}
.card{background:#f7fbf8;border:1px solid #d9e9e0;border-radius:12px;padding:15px}
small,.muted{color:var(--aaw-muted)}
label{color:#3b6150;font-weight:600}
input,select,textarea{background:#fff;border:1px solid #bfd7ca;color:#173b2b;border-radius:9px}
input:focus,select:focus,textarea:focus{outline:2px solid #22a46a;outline-offset:1px}
button{background:linear-gradient(125deg,#066d3d,#16a365);color:#fff;border-radius:9px;box-shadow:0 3px 12px #087b4521}
.alt,.tabs button{background:#e7f4ec;color:#135537;box-shadow:none}
.tabs{gap:8px}.tabs button{border:1px solid #d2e6d9;min-height:42px}
.tabs button.active{background:linear-gradient(120deg,#06703e,#19a467);color:white;border-color:transparent}
button:hover{filter:brightness(.97)}
h2,h3{color:#163f2c}
#notice,#loginMsg{color:#096b41}
th{background:#e3f3e9;color:#184c33}th,td{border-color:#c9e0d3;color:#244735}
.slip{background:#fff;color:#111}.slip th,.slip td{color:#111;border-color:#aaa}.slip th{background:#eee}
footer{color:#607c6c}
#login{max-width:520px;margin:clamp(25px,5vw,70px) auto}
#login h2{font-size:clamp(21px,2.5vw,29px)}
#login button{min-height:45px}
#content{min-height:190px}
@media(min-width:850px){.grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.tabs button{font-size:14px}}
@media(max-width:600px){header{padding:11px 12px;align-items:center}header .brand{gap:7px}header .brand-logo{width:69px;height:48px}header b{font-size:17px}header small{font-size:9px}main{margin:14px auto;padding:0 10px}.box{padding:14px}.tabs button{flex:1 1 auto}.grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}}

/* Shared salary calculation */
async function allSalaryRows(query){
const rows=[],size=500;
for(let offset=0;offset<100000;offset+=size){
const r=await query.range(offset,offset+size-1);if(r.error)throw r.error;
const page=r.data||[];rows.push(...page);if(page.length<size)return rows;
}
throw Error('Salary record limit reached; use an independently verified reconciliation');
}
async function salaryData(site,from,to,id='all',cumulative=false){
if(!from||!to||from>to)throw Error('Invalid salary dates');
let a=db.from('worker_attendance').select('worker_id,status,overtime_hours').eq('site_id',site).gte('attendance_date',from).lte('attendance_date',to);
let b=db.from('worker_advances').select('worker_id,amount,notes').eq('site_id',site).gte('advance_date',from).lte('advance_date',to);
let c=db.from('worker_salary_payments').select('worker_id,amount').eq('site_id',site);
c=cumulative?c.lte('payment_date',to):c.lte('period_start',to).gte('period_end',from);
if(id!=='all'){a=a.eq('worker_id',id);b=b.eq('worker_id',id);c=c.eq('worker_id',id)}
const r=await Promise.all([
 allSalaryRows(a.order('id')),allSalaryRows(b.order('id')),allSalaryRows(c.order('id')),
 allSalaryRows(db.rpc('get_final_food_deductions',{p_site_id:site,p_start:from,p_end:to}).order('worker_id'))
]);
return {attendance:r[0],advances:r[1],payments:r[2],finalFood:r[3]};
}
// The payment guard uses all earnings/deductions through the cutoff, not just this month.
async function salaryCutoffData(site,to,id){return salaryData(site,'0001-01-01',to,id,true)}
function calculateWorker(w,data){
let match=x=>String(x.worker_id)===String(w.id);
let att=data.attendance.filter(match),adv=data.advances.filter(match),pay=data.payments.filter(match);
let final=(data.finalFood||[]).filter(match);
let days=att.reduce((n,x)=>n+(x.status==='present'?1:x.status==='half_day'?0.5:0),0);
let ot=att.reduce((n,x)=>n+Number(x.overtime_hours||0),0);
let wage=days*Number(w.daily_wage||0),otPay=ot*Number(w.overtime_rate||0);
let isFood=x=>String(x.notes||'').trim().toUpperCase().startsWith('FOOD:');
let manualFood=adv.filter(isFood).reduce((n,x)=>n+Number(x.amount||0),0);
let advance=adv.filter(x=>!isFood(x)).reduce((n,x)=>n+Number(x.amount||0),0);
let finalFood=final.reduce((n,x)=>n+Number(x.deduction_amount||0),0);
let paid=pay.reduce((n,x)=>n+Number(x.amount||0),0);
let gross=wage+otPay,food=manualFood+finalFood,due=gross-advance-food-paid;
return {days,ot,wage,otPay,manualFood,finalFood,food,advance,paid,gross,due};
}

function calculateOvertime(checkIn,checkOut,nextDay=false){
const minutes=s=>{const m=/^(\d{2}):(\d{2})(?::(\d{2}))?$/.exec(String(s));if(!m||+m[1]>23||+m[2]>59||+(m[3]||0)>59)throw Error('Enter valid In-Time and Out-Time');return +m[1]*60 + +m[2] + +(m[3]||0)/60};
const start=minutes(checkIn),end=minutes(checkOut)+(nextDay?1440:0),duration=end-start;
if(duration<=0||duration>1440)throw Error('Check Out-Time or select Next Day for an overnight shift');
return Math.round(Math.max(0,duration/60-8)*100)/100;
}

if(working&&auto){check_in=row.querySelector('.ain').value;check_out=row.querySelector('.aout').value;ot=calculateOvertime(check_in,check_out,row.querySelector('.anext').checked)}
if(!working)ot=0;
if(!Number.isFinite(ot)||ot<0)throw Error('Invalid OT hours');
return {status,overtime_hours:ot,check_in,check_out};
}

</div>

let saved=new Map(),loaded='',duplicates=false;
async function load(){
loaded='';$('saveAtt').disabled=true;
try{
let day=$('ad').value;
let r=await db.from('worker_attendance').select('id,worker_id,status,overtime_hours,check_in,check_out').eq('site_id',site).eq('attendance_date',day).range(0,9999);
if(r.error)throw r.error;
if(r.data.length===10000)throw Error('Too many records');
saved=new Map();duplicates=false;
r.data.forEach(x=>{
let k=String(x.worker_id);
if(saved.has(k))duplicates=true;else saved.set(k,x);
});
$('alist').innerHTML=active.map(w=>{
let x=saved.get(String(w.id)),s=x?.status||'present';
return `<div class="att" data-id="${esc(w.id)}"><b>${esc(w.full_name)}</b><div class="grid">
<label>Status<select class="as">${[['present','Present'],['absent','Absent'],['half_day','Half Day'],['leave','Leave']].map(([v,n])=>`<option value="${v}" ${s===v?'selected':''}>${n}</option>`).join('')}</select></label>
<label>Attendance Mode<select class="amode"><option value="manual">Manual OT</option><option value="time" ${x?.check_in&&x?.check_out?'selected':''}>In-Time / Out-Time</option></select></label>
<label>OT Hours<input class="ao" type="number" min="0" step="0.01" value="${Number(x?.overtime_hours||0)}"></label></div>
<div class="grid atimes" hidden><label>In-Time<input class="ain" type="time" value="${esc((x?.check_in||'').slice(0,5))}"></label><label>Out-Time<input class="aout" type="time" value="${esc((x?.check_out||'').slice(0,5))}"></label><label><input class="anext" type="checkbox" style="width:auto" ${x?.check_out&&x?.check_in&&x.check_out<=x.check_in?'checked':''}> Out-Time next day</label></div><small class="atip"></small></div>`;
}).join('');
$('alist').querySelectorAll('.att').forEach(row=>{
const update=()=>{const auto=row.querySelector('.amode').value==='time';row.querySelector('.atimes').hidden=!auto;row.querySelector('.ao').readOnly=auto;
try{const value=readAttendanceRow(row);row.querySelector('.ao').value=value.overtime_hours;row.querySelector('.atip').textContent=auto?'OT calculated after 8 hours.':''}catch(e){row.querySelector('.atip').textContent=e.message}};
row.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',update));update();
});
loaded=day;$('saveAtt').disabled=duplicates||!active.length;
notice(duplicates?'Duplicate attendance found; saving disabled':'Attendance loaded: '+day);
}catch(e){notice('Load Error: '+e.message)}
}
$('load').onclick=load;
$('ad').onchange=()=>{loaded='';$('saveAtt').disabled=true;$('alist').innerHTML='Press Load Attendance'};
$('present').onclick=()=>{
$('alist').querySelectorAll('.as').forEach(s=>{s.value='present';s.dispatchEvent(new Event('change'))});
notice('Marked Present; press Save All');
};
$('saveAtt').onclick=async()=>{
if(loaded!==$('ad').value||duplicates)return;
let rows=[...$('alist').querySelectorAll('.att')];
let entries;
try{entries=rows.map(row=>({id:row.dataset.id,...readAttendanceRow(row)}))}catch(e){notice(e.message);return}
if(!confirm('Save '+entries.length+' workers attendance for '+loaded+'?'))return;
$('saveAtt').disabled=true;let ok=0,errors=[];
for(let x of entries){
let old=saved.get(String(x.id));
let r=old
?await db.from('worker_attendance').update({status:x.status,overtime_hours:x.overtime_hours,check_in:x.check_in,check_out:x.check_out}).eq('id',old.id).eq('site_id',site).select('id')
:await db.from('worker_attendance').insert({site_id:site,worker_id:x.id,attendance_date:loaded,status:x.status,overtime_hours:x.overtime_hours,check_in:x.check_in,check_out:x.check_out}).select('id');
if(r.error||!r.data?.length)errors.push(r.error?.message||'Permission denied');else ok++;
}
notice(ok+' Saved; '+errors.length+' Failed'+(errors.length?'\n'+errors.slice(0,3).join('\n'):''));
if(!errors.length)await load();
};
await load();
}
async function monthlyReport(site){
let month=date().slice(0,7);
$('content').innerHTML=`<h2>Monthly Attendance Report</h2>
<div class="grid">
<label>Month<input id="rm" type="month" value="${month}"></label>
<label>Worker<select id="rw"></select></label>
</div>
<button id="runReport">Generate Report</button>
<div id="reportResult"></div>`;
try{
let list=await fullWorkers(site);
$('rw').innerHTML=workerOptions(list,true);
$('runReport').onclick=async()=>{
let m=$('rm').value,id=$('rw').value;
if(!/^\d{4}-\d{2}$/.test(m)){notice('Select valid month');return}
let [year,mo]=m.split('-').map(Number);
let from=m+'-01',to=new Date(Date.UTC(year,mo,0)).toISOString().slice(0,10);
$('runReport').disabled=true;notice('Generating report...');
try{
let records=[],offset=0;
while(true){
let q=db.from('worker_attendance').select('worker_id,attendance_date,status,overtime_hours')
.eq('site_id',site).gte('attendance_date',from).lte('attendance_date',to)
.order('attendance_date').range(offset,offset+999);
if(id!=='all')q=q.eq('worker_id',id);
let r=await q;if(r.error)throw r.error;
records.push(...r.data);
if(r.data.length<1000)break;
offset+=1000;
if(offset>=20000)throw Error('Too many records');
}
let total={p:0,a:0,h:0,l:0,days:0,ot:0};
let rows=list.filter(w=>id==='all'||String(w.id)===id).map(w=>{
let a=records.filter(x=>String(x.worker_id)===String(w.id));
let p=a.filter(x=>x.status==='present').length;
let ab=a.filter(x=>x.status==='absent').length;
let h=a.filter(x=>x.status==='half_day').length;
let l=a.filter(x=>x.status==='leave').length;
let days=p+h*.5,ot=a.reduce((n,x)=>n+Number(x.overtime_hours||0),0);
total.p+=p;total.a+=ab;total.h+=h;total.l+=l;total.days+=days;total.ot+=ot;
return `<tr><td>${esc(w.full_name)}</td><td>${p}</td><td>${ab}</td><td>${h}</td><td>${l}</td><td>${days}</td><td>${ot}</td></tr>`;
}).join('');
$('reportResult').innerHTML=`<div class="card"><b>${esc(m)} · Monthly Attendance</b></div>
<div class="wrap"><table><thead><tr><th>Worker</th><th>P</th><th>A</th><th>H</th><th>L</th><th>Paid Days</th><th>OT</th></tr></thead>
<tbody>${rows}<tr><th>Total</th><th>${total.p}</th><th>${total.a}</th><th>${total.h}</th><th>${total.l}</th><th>${total.days}</th><th>${Number(total.ot.toFixed(2))}</th></tr></tbody></table></div>
<p class="muted">Only saved attendance counts. Missing days are not automatically Absent.</p>`;
notice('Monthly report ready');
}catch(e){notice('Report Error: '+e.message)}
finally{$('runReport').disabled=false}
};
}catch(e){notice('Report Error: '+e.message)}
}

async function foodDeduction(site){
$('content').innerHTML=`<h2>Food Deduction</h2>
<p class="muted">Food deduction is stored in Advances with FOOD: notes. Do not enter the same amount again in Advances.</p>
<form id="foodForm">
<label>Worker<select id="fw" required></select></label>
<div class="grid">
<label>Date<input id="fd" type="date" value="${date()}" required></label>
<label>Amount ₹<input id="fa" type="number" min="0.01" step="0.01" required></label>
</div>
<label>Food Details<input id="fn" type="text" placeholder="Meals / Canteen"></label>
<button id="foodSave">Save Food Deduction</button>
</form>
<h3>Recent Food Deductions</h3>
<div id="foodList"></div>`;
let active=workers.filter(w=>!w.is_deleted&&w.is_active!==false);
$('fw').innerHTML=workerOptions(active);
async function loadFood(){
let r=await db.from('worker_advances').select('worker_id,advance_date,amount,notes')
.eq('site_id',site).order('advance_date',{ascending:false}).limit(500);
if(r.error){notice('Food List Error: '+r.error.message);return}
let foods=r.data.filter(x=>String(x.notes||'').trim().toUpperCase().startsWith('FOOD:'));
$('foodList').innerHTML=foods.length?foods.map(x=>{
let name=workers.find(w=>String(w.id)===String(x.worker_id))?.full_name||'Worker';
return `<div class="card"><b>${esc(name)}</b><small>${esc(x.advance_date)} · ${cash(x.amount)} · ${esc(x.notes)}</small></div>`;
}).join(''):'<p class="muted">No food deductions found in recent entries.</p>';
}
$('foodForm').onsubmit=async e=>{
e.preventDefault();
let worker=$('fw').value,amount=Number($('fa').value);
if(!worker||!Number.isFinite(amount)||amount<=0){notice('Enter valid worker and amount');return}
if(!confirm('Save food deduction '+cash(amount)+'?'))return;
$('foodSave').disabled=true;
try{
let details=$('fn').value.trim();
let r=await db.from('worker_advances').insert({
site_id:site,
worker_id:worker,
advance_date:$('fd').value,
amount:amount,
notes:'FOOD: '+(details||'Meals')
}).select('worker_id');
if(r.error)throw r.error;
if(!r.data?.length)throw Error('Permission denied');
$('fa').value='';$('fn').value='';
await loadFood();
notice('Food deduction saved');
}catch(e){notice('Food Error: '+e.message)}
finally{$('foodSave').disabled=false}
};
await loadFood();
}

const bytes=Uint8Array.from(atob(EMBEDDED_FOOD_HTML),c=>c.charCodeAt(0));
return new TextDecoder().decode(bytes);
}
async function foodManagement(site){
$('content').innerHTML=`<h2>Food Management · V5.18</h2><p class="muted">New food periods only for active workers. Archived worker history remains available. This is a separate test module.</p><p><a href="food-v518-fixed.html?role=${encodeURIComponent(expectedRole||'direct')}" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#ff752e;color:#102330;font-weight:bold;text-decoration:none;padding:12px;border-radius:8px">Open Food Management ↗</a></p>`;
notice('Food Management loaded');
}
async function salaryPayment(site){
if(!['master','incharge'].includes(role)){notice('Salary access denied');return}
const d=date();
$('content').innerHTML=`<h2>Salary Payments · Balance & Payment Register</h2>
<p class="muted">Finalized food deductions, advances and earlier payments are included. The database must independently reject overpayments. Save only genuine salary payments.</p>
<label>Worker<select id="pw"></select></label>
<div class="grid"><label>Period From<input id="pf" type="date" value="${d.slice(0,7)}-01"></label>
<label>Period To<input id="pt" type="date" value="${d}"></label></div>
<button class="alt" id="pc">Calculate Payable</button><div id="payPreview"></div>
<label>Payment Date<input id="pd" type="date" value="${d}"></label>
<label>Amount ₹<input id="pa" type="number" min="0.01" step="0.01" placeholder="Amount"></label>
<label>Notes<input id="pn" type="text" placeholder="Payment reference / remarks"></label>
<div class="actions"><button id="ps" disabled>Calculate Before Saving</button><button class="alt" id="pr">Refresh History</button></div>
<div id="ph"></div>`;
let list=await fullWorkers(site);list=list.filter(x=>!x.is_deleted&&x.is_active!==false);
$('pw').innerHTML=workerOptions(list);
let verified=null;
let savingSalary=false;
const invalidate=()=>{verified=null;$('ps').disabled=true;$('ps').textContent='Calculate Before Saving';$('payPreview').textContent='';};
for(const key of ['pw','pf','pt','pd'])$(key).addEventListener('change',invalidate);
const history=async()=>{
let worker=$('pw').value;if(!worker){$('ph').textContent='Select worker';return}
let r=await db.from('worker_salary_payments').select('payment_date,period_start,period_end,amount,notes')
.eq('site_id',site).eq('worker_id',worker).order('payment_date',{ascending:false}).limit(100);
if(r.error)throw r.error;
$('ph').innerHTML='<h3>Previous Salary Payments</h3>'+((r.data||[]).map(x=>
`<div class="card"><b>${cash(x.amount)}</b><small>Paid: ${esc(x.payment_date)} · Period: ${esc(x.period_start)} to ${esc(x.period_end)}</small><small>${esc(x.notes||'')}</small></div>`).join('')||'<p class="muted">No payments</p>');
};
const calculate=async()=>{
const worker=$('pw').value,from=$('pf').value,to=$('pt').value;
if(!worker||!from||!to||from>to)throw Error('Select a worker and valid period');
const w=list.find(x=>String(x.id)===worker);if(!w)throw Error('Worker not active');
const data=await salaryCutoffData(site,to,worker),x=calculateWorker(w,data);
const due=Math.round(x.due*100)/100;
verified={worker,from,to,due};
$('payPreview').innerHTML=`<div class="card"><b>${esc(w.full_name)}</b>
<small>Cumulative balance through ${esc(to)}; selected period labels the payment.</small>
<small>Wages ${cash(x.wage)} + OT ${cash(x.otPay)} = Gross ${cash(x.gross)}</small>
<small>Advances ${cash(x.advance)} · Manual Food ${cash(x.manualFood)} · Final Food ${cash(x.finalFood)} · Already Paid ${cash(x.paid)}</small>
<b>Available Balance: ${cash(due)}</b></div>`;
$('ps').disabled=!(due>0);$('ps').textContent=due>0?'Save Actual Salary Payment':'No Positive Balance';
return verified;
};
$('pc').onclick=async()=>{try{await calculate();notice('Salary calculated. Check all deductions.')}catch(e){invalidate();notice('Calculation Error: '+e.message)}};
$('pr').onclick=async()=>{try{await history()}catch(e){notice(e.message)}};
$('ps').onclick=async()=>{
if(!verified||savingSalary)return;
const amount=Number($('pa').value),payment_date=$('pd').value;
if(!Number.isFinite(amount)||amount<=0||Math.abs(Math.round(amount*100)-amount*100)>0.000001||!payment_date){notice('Enter valid date and positive amount with at most 2 decimals');return}
if(payment_date<verified.from||payment_date>verified.to){notice('Payment date must be within salary period');return}
$('ps').disabled=true;savingSalary=true;
try{
// Re-read balances immediately before inserting; server trigger must enforce the limit atomically.
const old={...verified};const fresh=await calculate();
if(old.worker!==fresh.worker||old.from!==fresh.from||old.to!==fresh.to)throw Error('Worker or period changed');
if(amount>fresh.due+0.00001)throw Error('Amount exceeds outstanding balance');
if(!confirm(`SAVE ACTUAL SALARY PAYMENT?\nAmount: ${cash(amount)}\nOutstanding before payment: ${cash(fresh.due)}\nThis creates a permanent financial record.`))return;
const payload={worker_id:fresh.worker,site_id:site,payment_date,period_start:fresh.from,period_end:fresh.to,amount,notes:$('pn').value.trim()||null};
const r=await db.from('worker_salary_payments').insert(payload).select('worker_id,amount');
if(r.error)throw r.error;
if(!r.data||r.data.length!==1)throw Error('Payment not confirmed by server');
notice('Salary payment saved online');$('pa').value='';invalidate();try{await history()}catch(histErr){notice('Payment saved online; history refresh failed: '+histErr.message)}
}catch(e){notice('Salary payment NOT confirmed: '+e.message)}
finally{savingSalary=false;if(verified)$('ps').disabled=!(verified.due>0)}
};
try{await history()}catch(e){notice(e.message)}
}
loadLibrary();
</script>
