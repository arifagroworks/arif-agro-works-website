
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arif Agro Works | Portal V5.3</title>

<style>
:root{
  font-family:system-ui,-apple-system,Arial,sans-serif;
  color:#edf5f8;
  background:#071b28;
}
*{box-sizing:border-box}
body{margin:0}
header{
  background:#0c2c3d;
  border-bottom:3px solid #ff752e;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
h1{font-size:20px;margin:0}
.accent{color:#ff752e}
small,.muted{color:#a8c0ca}
main{max-width:900px;margin:18px auto;padding:0 12px}
.panel{
  background:#103044;
  border:1px solid #325365;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px}
label{
  display:block;
  font-size:13px;
  color:#c8dce5;
  margin:9px 0;
}
input,select,textarea{
  display:block;
  width:100%;
  background:#071e2d;
  color:#fff;
  border:1px solid #547083;
  border-radius:8px;
  padding:11px;
  margin-top:5px;
  font-size:16px;
}
textarea{min-height:60px}
button{
  background:#ff752e;
  color:#102330;
  border:0;
  border-radius:9px;
  padding:11px 13px;
  font-weight:700;
  cursor:pointer;
}
button.secondary{
  background:#22465a;
  color:white;
  border:1px solid #607f91;
}
button:disabled{opacity:.55;cursor:wait}
.hide{display:none!important}
.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.tabs button{font-size:13px;padding:9px 10px}
.tabs .active{background:#ff752e;color:#102330}
.tabs button:not(.active){background:#22465a;color:#fff}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:10px;
}
.item{
  border:1px solid #39586b;
  border-radius:10px;
  padding:12px;
  margin:8px 0;
  background:#092333;
  overflow-wrap:anywhere;
}
.item small{display:block;margin-top:5px}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.message{
  margin-top:12px;
  color:#ffca9e;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}
.success{color:#7be3a6}
.att-row{
  display:grid;
  grid-template-columns:minmax(100px,1.3fr) minmax(130px,1fr) minmax(90px,.6fr);
  gap:10px;
  align-items:end;
  border-bottom:1px solid #365568;
  padding:12px 0;
}
.att-name{font-weight:700;padding-bottom:13px}
.att-row label{margin:0}
.att-row select,.att-row input{margin-top:4px}
footer{
  text-align:center;
  color:#91aeba;
  padding:20px;
  font-size:12px;
}
@media(max-width:540px){
  .att-row{grid-template-columns:1fr 1fr}
  .att-name{grid-column:1/-1;padding-bottom:0}
}
</style>
</head>

<script>
/*
  Login diagnostics are installed BEFORE the
  Supabase library is loaded.
*/
(function(){
  var status=document.getElementById('loginStatus');

  function show(message){
    if(status) status.textContent=String(message);
  }

  window.portalLoginMessage=show;

  window.addEventListener('error',function(e){
    show('JavaScript Error: '+(e.message||'Unknown error'));
  });

  window.addEventListener('unhandledrejection',function(e){
    var reason=e.reason;
    show('Request Error: '+(
      reason && reason.message ? reason.message : String(reason)
    ));
  });

  show('Connecting to secure login service...');
})();
</script>

</script>

<script>
(function(){

const URL='https://qfydekphbdpvvczhimjs.supabase.co';

/* SUPABASE INITIALIZATION */

try{

/* LOGIN */

function loginBusy(yes){
  loggingIn=yes;
  $('signin').disabled=yes;
  $('signin').textContent=yes?'Logging in...':'Secure Login';
}

function timeoutPromise(ms){
  return new Promise((_,reject)=>{
    setTimeout(()=>{
      reject(new Error(
        'Login request timed out. Internet या Supabase connection check करें.'
      ));
    },ms);
  });
}

async function signIn(e){
  e.preventDefault();

  if(loggingIn) return;

  const email=$('email').value.trim();
  const password=$('password').value;

  if(!email||!password){
    loginMsg('Email और Password दोनों भरें।');
    return;
  }

  loginBusy(true);
  loginMsg('Connecting to Supabase...');

  try{
    const result=await Promise.race([
      db.auth.signInWithPassword({email,password}),
      timeoutPromise(15000)
    ]);

    if(result.error){
      throw result.error;
    }

    loginMsg('Login successful. Loading your sites...');

    await Promise.race([
      init(),
      timeoutPromise(15000)
    ]);

  }catch(e){
    loginMsg('Login Error: '+(e.message||String(e)));
  }finally{
    loginBusy(false);
  }
}

$('loginForm').addEventListener('submit',signIn);

$('logout').addEventListener('click',async()=>{

    .select('role,full_name')
    .eq('user_id',user.id)
    .single();

  if(pe) throw new Error('Staff Profile: '+pe.message);

  }

  role=p.role;

  const {data:s,error:se}=await db
    .from('sites')

  if(se) throw new Error('Sites: '+se.message);

  sites=s||[];

  hide('login',true);
  hide('app',false);
  hide('logout',false);

  await render();

}

/* FORM FIELDS */

function fieldHTML([k,label,type,required]){
  let input;

  if(type==='worker'){
    input=`<select name="${k}" ${required?'required':''}>
      <option value="">Choose worker</option>
      ${workers
        .filter(w=>w.is_deleted!==true&&w.is_active!==false)
        .map(w=>`<option value="${esc(w.id)}">${esc(w.full_name)}</option>`)
        .join('')}
    </select>`;

  }else if(type==='cash'){
    input=`<select name="${k}">
      <option value="cash_in">Cash in</option>
      <option value="cash_out">Cash out</option>
    </select>`;

  }else{
    input=`<input name="${k}" type="${type}"
      ${required?'required':''}
      ${type==='number'?'step="0.01" min="0"':''}
      ${type==='date'?'value="'+today()+'"':''}>`;
  }

  return `<label>${esc(label)}${required?' *':''}${input}</label>`;
}

/* SALARY SUMMARY */

async function renderSummary(site){
  const localToday=today();
  const month=localToday.slice(0,7);

  $('content').innerHTML=`
    <h2>Salary Summary</h2>
    <p class="muted">
      Single Worker या All Workers की Salary Calculate करें
    </p>

    <label>Worker चुनें
      <select id="salaryWorker">
        <option value="all">All Workers — सबकी Salary</option>
      </select>
    </label>

    <div class="grid">
      <label>From
        <input type="date" id="fromDate" value="${month}-01">
      </label>
      <label>To
        <input type="date" id="toDate" value="${localToday}">
      </label>
    </div>

    <button type="button" id="calculate">
      Calculate Salary
    </button>

    <p class="muted">
      Current wage और OT rate पर calculation होती है।
    </p>

    <div id="salaryResults"></div>
  `;

  const {data:allWorkers,error:workerError}=await db
    .from('workers')
    .select('id,full_name,daily_wage,overtime_rate,is_deleted')
    .eq('site_id',site)
    .order('full_name');

  if(workerError){
    msg('Workers loading failed: '+workerError.message);
    return;
  }

  const workerList=allWorkers||[];

  $('salaryWorker').innerHTML=
    '<option value="all">All Workers — सबकी Salary</option>'+
    workerList.map(w=>
      `<option value="${esc(w.id)}">
        ${esc(w.full_name)}${w.is_deleted?' (Archived)':''}
      </option>`
    ).join('');

  $('salaryWorker').onchange=()=>{
    $('salaryResults').innerHTML='';
  };

  $('calculate').onclick=async()=>{
    const start=$('fromDate').value;
    const end=$('toDate').value;
    const selectedWorker=$('salaryWorker').value;

    if(!start||!end||start>end){
      msg('Valid dates चुनें');
      return;
    }

    const selectedWorkers=selectedWorker==='all'
      ?workerList
      :workerList.filter(w=>String(w.id)===selectedWorker);

    if(!selectedWorkers.length){
      msg('Worker नहीं मिला');
      return;
    }

    const btn=$('calculate');
    btn.disabled=true;
    msg('Salary calculate हो रही है...');

    try{
      let attendanceQuery=db.from('worker_attendance')
        .select('worker_id,status,overtime_hours')
        .eq('site_id',site)
        .gte('attendance_date',start)
        .lte('attendance_date',end);

      let advancesQuery=db.from('worker_advances')
        .select('worker_id,amount')
        .eq('site_id',site)
        .gte('advance_date',start)
        .lte('advance_date',end);

      let paymentsQuery=db.from('worker_salary_payments')
        .select('worker_id,amount')
        .eq('site_id',site)
        .gte('payment_date',start)
        .lte('payment_date',end);

      if(selectedWorker!=='all'){
        attendanceQuery=attendanceQuery.eq('worker_id',selectedWorker);
        advancesQuery=advancesQuery.eq('worker_id',selectedWorker);
        paymentsQuery=paymentsQuery.eq('worker_id',selectedWorker);
      }

      const [at,ad,pa]=await Promise.all([
        attendanceQuery.range(0,9999),
        advancesQuery.range(0,9999),
        paymentsQuery.range(0,9999)
      ]);

      const failure=[at,ad,pa].find(x=>x.error);

      if(failure) throw failure.error;

      if([at,ad,pa].some(x=>x.data.length>=10000)){
        throw new Error('Date range छोटा करें; records बहुत ज्यादा हैं।');
      }

      const total=(rows,id,key)=>rows
        .filter(r=>String(r.worker_id)===String(id))
        .reduce((sum,r)=>sum+Number(r[key]||0),0);

      let overall=0;

      $('salaryResults').innerHTML=selectedWorkers.map(w=>{
        const attendance=at.data.filter(r=>
          String(r.worker_id)===String(w.id)
        );

        const days=attendance.reduce((n,r)=>
          n+(r.status==='present'?1:
          r.status==='half_day'?0.5:0),0
        );

        const ot=total(attendance,w.id,'overtime_hours');
        const wage=days*Number(w.daily_wage||0);
        const overtime=ot*Number(w.overtime_rate||0);
        const advance=total(ad.data,w.id,'amount');
        const paid=total(pa.data,w.id,'amount');

        const due=wage+overtime-advance-paid;
        overall+=due;

        return `<div class="item">
          <strong>
            ${esc(w.full_name)}
            ${w.is_deleted?' (Archived)':''}
          </strong>
          <small>Paid days: ${days} · OT hours: ${ot}</small>
          <small>
            Wages ${money(wage)}
            + OT ${money(overtime)}
            − Advance ${money(advance)}
            − Paid ${money(paid)}
          </small>
          <strong>Balance: ${money(due)}</strong>
        </div>`;
      }).join('')+
      `<div class="item">
        <strong>
          ${selectedWorker==='all'
            ?'Total balance'
            :'Selected worker balance'}:
          ${money(overall)}
        </strong>
      </div>`;

      msg('Salary calculation ready');

    }catch(e){
      msg('Calculation Error: '+e.message);
    }finally{
      btn.disabled=false;
    }
  };
}

/* BULK ATTENDANCE */

async function renderAttendance(site){
  const activeWorkers=workers.filter(w=>
    w.is_active!==false&&w.is_deleted!==true
  );

  $('content').innerHTML=`
    <h2>Bulk Attendance</h2>
    <p class="muted">
      सभी Workers की Attendance एक साथ भरें।
    </p>

    <label>Attendance Date
      <input type="date" id="attDate" value="${today()}">
    </label>

    <div class="actions">
      <button type="button" class="secondary" id="loadAtt">
        Load Attendance
      </button>
      <button type="button" class="secondary" id="allPresent">
        Mark All Present
      </button>
    </div>

    <div id="attList"></div>

    <div class="actions">
      <button id="saveAll" type="button">
        Save All Attendance
      </button>
    </div>

    <p class="muted" id="attInfo"></p>
  `;

  const dateInput=$('attDate');
  const list=$('attList');
  const info=$('attInfo');
  const save=$('saveAll');

  let existing=new Map();
  let loadedDate='';
  let duplicates=0;

  function setBusy(v){
    save.disabled=v;
    $('loadAtt').disabled=v;
    $('allPresent').disabled=v;
    dateInput.disabled=v;
  }

  function buildRows(){
    if(!activeWorkers.length){
      list.innerHTML='<p class="muted">No active workers</p>';
      save.disabled=true;
      return;
    }

    list.innerHTML=activeWorkers.map(w=>{
      const a=existing.get(String(w.id));
      const status=a?.status||'present';
      const ot=Number(a?.overtime_hours||0);

      return `<div class="att-row" data-worker="${esc(w.id)}">
        <div class="att-name">
          ${esc(w.full_name)}
          <small>${a?'Saved attendance':'New attendance'}</small>
        </div>

        <label>Status
          <select class="attStatus">
            <option value="present" ${status==='present'?'selected':''}>
              Present
            </option>
            <option value="absent" ${status==='absent'?'selected':''}>
              Absent
            </option>
            <option value="half_day" ${status==='half_day'?'selected':''}>
              Half Day
            </option>
            <option value="leave" ${status==='leave'?'selected':''}>
              Leave
            </option>
          </select>
        </label>

        <label>OT Hours
          <input class="attOT" type="number" min="0"
            step="0.5" value="${ot}">
        </label>
      </div>`;
    }).join('');

    list.querySelectorAll('.attStatus').forEach(s=>{
      s.onchange=()=>{
        const row=s.closest('.att-row');
        if(s.value==='absent'||s.value==='leave'){
          row.querySelector('.attOT').value=0;
        }
      };
    });
  }

  async function loadAttendance(){
    const date=dateInput.value;

    if(!date){
      msg('Attendance date चुनें');
      return;
    }

    setBusy(true);
    info.textContent='Attendance loading...';

    try{
      const {data,error}=await db
        .from('worker_attendance')
        .select('id,worker_id,status,overtime_hours')
        .eq('site_id',site)
        .eq('attendance_date',date)
        .range(0,9999);

      if(error) throw error;

      if(data.length>=10000){
        throw new Error('Too many attendance records');
      }

      existing=new Map();
      duplicates=0;

      for(const r of data){
        const key=String(r.worker_id);
        if(existing.has(key)) duplicates++;
        else existing.set(key,r);
      }

      loadedDate=date;
      buildRows();

      info.textContent=
        `${activeWorkers.length} Active Workers · ${data.length} Saved Entries`;

      if(duplicates){
        save.disabled=true;
        msg(
          'Duplicate Attendance मिली है। पहले duplicate records
