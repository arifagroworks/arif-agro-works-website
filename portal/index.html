
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arif Agro Works | Portal V5.4</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#edf5f8;background:#071b28}
*{box-sizing:border-box}
body{margin:0}
header{background:#0c2c3d;border-bottom:3px solid #ff752e;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:0}
.accent{color:#ff752e}
small,.muted{color:#a8c0ca}
main{max-width:900px;margin:18px auto;padding:0 12px}
.panel{background:#103044;border:1px solid #325365;border-radius:15px;padding:18px;margin-bottom:15px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px}
label{display:block;font-size:13px;color:#c8dce5;margin:9px 0}
input,select,textarea{display:block;width:100%;background:#071e2d;color:#fff;border:1px solid #547083;border-radius:8px;padding:11px;margin-top:5px;font-size:16px}
textarea{min-height:60px}
button{background:#ff752e;color:#102330;border:0;border-radius:9px;padding:11px 13px;font-weight:700;cursor:pointer}
button.secondary{background:#22465a;color:white;border:1px solid #607f91}
button:disabled{opacity:.55}
.hide{display:none!important}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font-size:13px;padding:9px 10px}
.tabs .active{background:#ff752e;color:#102330}
.tabs button:not(.active){background:#22465a;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.item{border:1px solid #39586b;border-radius:10px;padding:12px;margin:8px 0;background:#092333;overflow-wrap:anywhere}
.item small{display:block;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.message{margin-top:12px;color:#ffca9e;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.att-row{display:grid;grid-template-columns:minmax(100px,1.3fr) minmax(130px,1fr) minmax(90px,.6fr);gap:10px;align-items:end;border-bottom:1px solid #365568;padding:12px 0}
.att-name{font-weight:700;padding-bottom:13px}
.att-row label{margin:0}
footer{text-align:center;color:#91aeba;padding:20px;font-size:12px}
@media(max-width:540px){.att-row{grid-template-columns:1fr 1fr}.att-name{grid-column:1/-1;padding-bottom:0}}
</style>
</head>

(function(){

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

function loadScript(src,timeout=8000){
return new Promise((resolve,reject)=>{
const s=document.createElement('script');
let finished=false;
const timer=setTimeout(()=>{
if(finished)return;
finished=true;
s.remove();
reject(new Error('CDN timeout'));
},timeout);
s.onload=()=>{
if(finished)return;
finished=true;
clearTimeout(timer);
resolve();
};
s.onerror=()=>{
if(finished)return;
finished=true;
clearTimeout(timer);
reject(new Error('CDN failed'));
};
s.src=src;
document.head.appendChild(s);
});
}

async function loadSupabase(){
const urls=[
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js',
'https://cdnjs.cloudflare.com/ajax/libs/supabase/2.0.0/supabase.min.js'
];
for(let i=0;i<urls.length;i++){
loginMsg('Loading secure login library... Attempt '+(i+1)+' of '+urls.length);
try{
await loadScript(urls[i]);
if(window.supabase?.createClient)return;
}catch(e){}
}
throw new Error('Supabase library किसी CDN से Load नहीं हुई।');
}

function timeout(ms,label){
return new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out')),ms));
}

function busy(v){
loggingIn=v;
$('signin').disabled=v;
$('signin').textContent=v?'Logging in...':'Secure Login';
}

async function start(){
try{
await loadSupabase();
db=window.supabase.createClient(URL,KEY,{
auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
});
busy(false);
loginMsg('Login service ready. Secure Login दबाएँ।');

const session=await Promise.race([
db.auth.getSession(),
timeout(12000,'Session')
]);
if(session.error)throw session.error;
if(session.data.session){
loginMsg('Existing session found. Loading portal...');
await Promise.race([init(),timeout(15000,'Portal startup')]);
}
}catch(e){
busy(false);
loginMsg('Startup Error: '+e.message);
}
}

$('loginForm').onsubmit=async e=>{
e.preventDefault();
if(loggingIn)return;
if(!db){loginMsg('Login service अभी तैयार नहीं है।');return}
busy(true);
loginMsg('Connecting to Supabase...');
try{
const result=await Promise.race([
db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
}),
timeout(15000,'Login')
]);
if(result.error)throw result.error;
loginMsg('Login successful. Loading sites...');
await Promise.race([init(),timeout(15000,'Portal')]);
}catch(e){
loginMsg('Login Error: '+e.message);
}finally{busy(false)}
};

$('logout').onclick=async()=>{
try{await db.auth.signOut()}catch(e){msg(e.message)}
role=null;
hide('login',false);hide('app',true);hide('logout',true);
loginMsg('Logged out');
};

$('site').onchange=()=>{editing=null;showDeleted=false;render()};

async function init(){
const {data:{user},error:ue}=await db.auth.getUser();
if(ue)throw ue;
if(!user){hide('login',false);hide('app',true);hide('logout',true);return}

const {data:p,error:pe}=await db.from('staff_profiles')
.select('role,full_name').eq('user_id',user.id).single();
if(pe)throw new Error('Profile: '+pe.message);
role=p.role;

const {data:s,error:se}=await db.from('sites')
.select('id,site_name').eq('is_active',true).order('site_name');
if(se)throw new Error('Sites: '+se.message);
sites=s||[];

$('who').textContent=(p.full_name||'Staff')+' · '+role;
const previous=$('site').value;
$('site').innerHTML=sites.map(x=>`<option value="${esc(x.id)}">${esc(x.site_name)}</option>`).join('');
if(sites.some(x=>String(x.id)===previous))$('site').value=previous;

hide('login',true);hide('app',false);hide('logout',false);
await render();
msg('Welcome to Portal V5.4');

function fieldHTML([k,label,type,required]){
let input;
if(type==='worker'){
input=`<select name="${k}" ${required?'required':''}>
<option value="">Choose worker</option>
${workers.filter(w=>w.is_deleted!==true&&w.is_active!==false)
.map(w=>`<option value="${esc(w.id)}">${esc(w.full_name)}</option>`).join('')}
</select>`;
}else if(type==='cash'){
input=`<select name="${k}"><option value="cash_in">Cash in</option><option value="cash_out">Cash out</option></select>`;
}else{
input=`<input name="${k}" type="${type}" ${required?'required':''}
${type==='number'?'step="0.01" min="0"':''}
${type==='date'?'value="'+today()+'"':''}>`;
}
return `<label>${esc(label)}${required?' *':''}${input}</label>`;
}

/* SALARY SUMMARY */
async function renderSummary(site){
const localToday=today(),month=localToday.slice(0,7);
$('content').innerHTML=`
<h2>Salary Summary</h2>
<p class="muted">Single Worker या All Workers की Salary Calculate करें</p>
<label>Worker चुनें<select id="salaryWorker"><option value="all">All Workers — सबकी Salary</option></select></label>
<div class="grid">
<label>From<input type="date" id="fromDate" value="${month}-01"></label>
<label>To<input type="date" id="toDate" value="${localToday}"></label>
</div>
<button type="button" id="calculate">Calculate Salary</button>
<p class="muted">Current wage और OT rate पर calculation होती है।</p>
<div id="salaryResults"></div>`;

const {data:allWorkers,error:workerError}=await db.from('workers')
.select('id,full_name,daily_wage,overtime_rate,is_deleted')
.eq('site_id',site).order('full_name');
if(workerError){msg('Workers loading failed: '+workerError.message);return}
const workerList=allWorkers||[];

$('salaryWorker').innerHTML=
'<option value="all">All Workers — सबकी Salary</option>'+
workerList.map(w=>`<option value="${esc(w.id)}">${esc(w.full_name)}${w.is_deleted?' (Archived)':''}</option>`).join('');

$('salaryWorker').onchange=()=>{$('salaryResults').innerHTML=''};

$('calculate').onclick=async()=>{
const start=$('fromDate').value,end=$('toDate').value,selectedWorker=$('salaryWorker').value;
if(!start||!end||start>end){msg('Valid dates चुनें');return}
const selectedWorkers=selectedWorker==='all'?workerList:workerList.filter(w=>String(w.id)===selectedWorker);
if(!selectedWorkers.length){msg('Worker नहीं मिला');return}

const btn=$('calculate');btn.disabled=true;msg('Salary calculate हो रही है...');
try{
let aq=db.from('worker_attendance').select('worker_id,status,overtime_hours')
.eq('site_id',site).gte('attendance_date',start).lte('attendance_date',end);
let vq=db.from('worker_advances').select('worker_id,amount')
.eq('site_id',site).gte('advance_date',start).lte('advance_date',end);
let pq=db.from('worker_salary_payments').select('worker_id,amount')
.eq('site_id',site).gte('payment_date',start).lte('payment_date',end);

if(selectedWorker!=='all'){
aq=aq.eq('worker_id',selectedWorker);
vq=vq.eq('worker_id',selectedWorker);
pq=pq.eq('worker_id',selectedWorker);
}
const [at,ad,pa]=await Promise.all([aq.range(0,9999),vq.range(0,9999),pq.range(0,9999)]);
const fail=[at,ad,pa].find(x=>x.error);
if(fail)throw fail.error;
if([at,ad,pa].some(x=>x.data.length>=10000))throw new Error('Date range छोटा करें');

const total=(rows,id,key)=>rows.filter(r=>String(r.worker_id)===String(id))
.reduce((n,r)=>n+Number(r[key]||0),0);

let overall=0;
$('salaryResults').innerHTML=selectedWorkers.map(w=>{
const attendance=at.data.filter(r=>String(r.worker_id)===String(w.id));
const days=attendance.reduce((n,r)=>n+(r.status==='present'?1:r.status==='half_day'?0.5:0),0);
const ot=total(attendance,w.id,'overtime_hours');
const wage=days*Number(w.daily_wage||0);
const overtime=ot*Number(w.overtime_rate||0);
const advance=total(ad.data,w.id,'amount');
const paid=total(pa.data,w.id,'amount');
const due=wage+overtime-advance-paid;
overall+=due;
return `<div class="item"><strong>${esc(w.full_name)}${w.is_deleted?' (Archived)':''}</strong>
<small>Paid days: ${days} · OT hours: ${ot}</small>
<small>Wages ${money(wage)} + OT ${money(overtime)} − Advance ${money(advance)} − Paid ${money(paid)}</small>
<strong>Balance: ${money(due)}</strong></div>`;
}).join('')+
`<div class="item"><strong>${selectedWorker==='all'?'Total balance':'Selected worker balance'}: ${money(overall)}</strong></div>`;
msg('Salary calculation ready');
}catch(e){msg('Calculation Error: '+e.message)}
finally{btn.disabled=false}
};
}

/* BULK ATTENDANCE */
async function renderAttendance(site){
const activeWorkers=workers.filter(w=>w.is_active!==false&&w.is_deleted!==true);
$('content').innerHTML=`
<h2>Bulk Attendance</h2>
<p class="muted">सभी Workers की Attendance एक साथ भरें।</p>
<label>Attendance Date<input type="date" id="attDate" value="${today()}"></label>
<div class="actions">
<button type="button" class="secondary" id="loadAtt">Load Attendance</button>
<button type="button" class="secondary" id="allPresent">Mark All Present</button>
</div>
<div id="attList"></div>
<div class="actions"><button id="saveAll" type="button">Save All Attendance</button></div>
<p class="muted" id="attInfo"></p>`;

const dateInput=$('attDate'),list=$('attList'),info=$('attInfo'),save=$('saveAll');
let existing=new Map(),loadedDate='',duplicates=0;

function setBusy(v){
save.disabled=v;
$('loadAtt').disabled=v;
$('allPresent').disabled=v;
dateInput.disabled=v;
}

function buildRows(){
if(!activeWorkers.length){list.innerHTML='<p class="muted">No active workers</p>';save.disabled=true;return}
list.innerHTML=activeWorkers.map(w=>{
const a=existing.get(String(w.id)),status=a?.status||'present',ot=Number(a?.overtime_hours||0);
return `<div class="att-row" data-worker="${esc(w.id)}">
<div class="att-name">${esc(w.full_name)}<small>${a?'Saved attendance':'New attendance'}</small></div>
<label>Status<select class="attStatus">
<option value="present" ${status==='present'?'selected':''}>Present</option>
<option value="absent" ${status==='absent'?'selected':''}>Absent</option>
<option value="half_day" ${status==='half_day'?'selected':''}>Half Day</option>
<option value="leave" ${status==='leave'?'selected':''}>Leave</option>
</select></label>
<label>OT Hours<input class="attOT" type="number" min="0" step="0.5" value="${ot}"></label>
</div>`;
}).join('');
list.querySelectorAll('.attStatus').forEach(s=>{
s.onchange=()=>{
if(s.value==='absent'||s.value==='leave')s.closest('.att-row').querySelector('.attOT').value=0;
};
});
}

async function loadAttendance(){
const date=dateInput.value;
if(!date){msg('Attendance date चुनें');return}
setBusy(true);info.textContent='Attendance loading...';
try{
const {data,error}=await db.from('worker_attendance')
.select('id,worker_id,status,overtime_hours')
.eq('site_id',site).eq('attendance_date',date).range(0,9999);
if(error)throw error;
if(data.length>=10000)throw new Error('Too many attendance records');
existing=new Map();duplicates=0;
for(const r of data){
const key=String(r.worker_id);
if(existing.has(key))duplicates++;else existing.set(key,r);
}
loadedDate=date;buildRows();
info.textContent=`${activeWorkers.length} Active Workers · ${data.length} Saved Entries`;
if(duplicates){save.disabled=true;msg('Duplicate Attendance मिली है। पहले duplicate records ठीक करें।')}
else msg('Attendance loaded: '+date);
}catch(e){loadedDate='';save.disabled=true;msg('Attendance Load Error: '+e.message);info.textContent='Loading failed'}
finally{
$('loadAtt').disabled=false;$('allPresent').disabled=false;dateInput.disabled=false;
if(!duplicates&&loadedDate===date&&activeWorkers.length)save.disabled=false;
}
}
$('loadAtt').onclick=loadAttendance;
dateInput.onchange=()=>{
loadedDate='';existing.clear();list.innerHTML='<p class="muted">नई Date के लिए Load Attendance दबाएँ।</p>';
info.textContent='';save.disabled=true;
};
$('allPresent').onclick=()=>{
list.querySelectorAll('.attStatus').forEach(s=>s.value='present');
msg('All marked Present. Save All दबाने पर Save होगा।');
};

save.onclick=async()=>{
const date=dateInput.value;
if(!date||date!==loadedDate){msg('पहले इसी Date की Attendance Load करें');return}
if(duplicates){msg('Duplicate records होने पर Save बंद है');return}
const rows=[...list.querySelectorAll('.att-row')];
if(!rows.length){msg('No active workers');return}
const entries=rows.map(row=>{
const status=row.querySelector('.attStatus').value,overtime=Number(row.querySelector('.attOT').value);
return {worker_id:row.dataset.worker,status,overtime_hours:status==='absent'||status==='leave'?0:overtime};
});
if(entries.some(r=>!Number.isFinite(r.overtime_hours)||r.overtime_hours<0)){msg('OT Hours सही भरें');return}
if(!confirm(`${date} की ${entries.length} Workers की Attendance Save/Update करें?`))return;
setBusy(true);msg('Attendance saving...');
let saved=0;const failures=[];
try{
for(const entry of entries){
const old=existing.get(String(entry.worker_id));
const values={site_id:site,worker_id:entry.worker_id,attendance_date:date,status:entry.status,overtime_hours:entry.overtime_hours};
let result;
if(old){
result=await db.from('worker_attendance')
.update({status:entry.status,overtime_hours:entry.overtime_hours})
.eq('id',old.id).eq('site_id',site).select('id');
}else{
result=await db.from('worker_attendance').insert(values).select('id');
}
if(result.error||!result.data?.length)failures.push(entry.worker_id+': '+(result.error?.message||'Permission denied'));
else saved++;
}
if(failures.length)msg(`${saved} Saved · ${failures.length} Failed\n${failures.slice(0,5).join('\n')}`);
else msg(`Success! ${saved} Workers की Attendance Save हो गई।`);
}catch(e){msg('Attendance Save Error: '+e.message)}
finally{setBusy(false)}
if(!failures.length)await loadAttendance();
};
await loadAttendance();
}

/* MAIN RENDER */
async function render(){
const version=++renderVersion,site=$('site').value;
if(!site){$('content').textContent='No assigned active sites';return}

const tabs=modules.filter(([k])=>role==='master'||!['salary','cash','summary'].includes(k));
if(!tabs.some(([k])=>k===tab))tab='workers';

$('tabs').innerHTML=tabs.map(([k,n])=>
`<button type="button" data-tab="${k}" class="${tab===k?'active':''}">${n}</button>`).join('');

$('tabs').querySelectorAll('[data-tab]').forEach(b=>{
b.onclick=()=>{tab=b.dataset.tab;editing=null;showDeleted=false;render()};
});

const {data:w,error:we}=await db.from('workers')
.select('id,full_name,is_active,is_deleted').eq('site_id',site).order('full_name');
if(version!==renderVersion)return;
if(we){msg('Workers Error: '+we.message);return}
workers=w||[];

if(tab==='summary'){await renderSummary(site);return}
if(tab==='attendance'){await renderAttendance(site);return}

const sp=spec[tab];
const order=tab==='workers'?'created_at':(sp.f
