name: Build ARIF AGRO WORKS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project files
        run: |
          test -f android-app/settings.gradle
          test -f android-app/build.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/java/com/arifagroworks/combined/MainActivity.java
          echo 'Using current files from the GitHub repository.'
          find android-app/app/src/main/res -maxdepth 3 -type f -print || true

      - name: Build APK from current source
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAW-Combined-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
