name: Build ARIF AGRO WORKS APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aaw-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Run isolated browser and calculation regressions
        run: npm test

  build:
    needs: regression
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools unavailable on runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project files
        run: |
          test -f android-app/settings.gradle
          test -f android-app/build.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/java/com/arifagroworks/combined/MainActivity.java
          echo 'Using current files from the GitHub repository.'
          find android-app/app/src/main/res -maxdepth 3 -type f -print || true

      - name: Preserve debug update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aaw-debug-signing-v1

      - name: Build APK from current source
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.arifagroworks.combined'" apk-badging.txt
          grep -q "launchable-activity: name='com.arifagroworks.combined.MainActivity'" apk-badging.txt
          unzip -l "$APK" | grep 'res/drawable/aaw_logo.png'
          "$AAPT" dump xmltree "$APK" res/layout/activity_splash.xml > apk-splash.txt
          grep -q 'android:src' apk-splash.txt
          if grep -q 'sym_def_app_icon' apk-splash.txt; then exit 1; fi
          "$AAPT" dump resources "$APK" > apk-resources.txt
          ICON_ID=$(python3 -c 'import re; s=open("apk-resources.txt").read(); print(re.search(r"resource (0x[0-9a-f]+) [^\n]*:drawable/aaw_logo:", s).group(1))')
          grep -q "android:src.*@$ICON_ID" apk-splash.txt
          "$AAPT" dump badging "$APK" | grep "versionName='1.4'"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAW-Combined-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native save, import, print, keyboard and back on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put system system_locales en-US
            cd android-app
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p ../native-artifacts
            adb pull /sdcard/Download ../native-artifacts/Download
      - name: Validate synthetic printed PDF text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          PDF=$(find native-artifacts -iname '*.pdf' | head -n 1)
          test -n "$PDF"
          pdftotext "$PDF" native-artifacts/printed-fixture.txt
          grep -q 'AAW-NATIVE-PRINT-FIXTURE' native-artifacts/printed-fixture.txt
      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAW-Android-Smoke-Evidence
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
            native-artifacts/
